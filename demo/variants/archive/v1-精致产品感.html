<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经历库 Demo · 精致产品感</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: three proportional columns (filter / timeline / detail) with draggable dividers; collapses to rail, then to one pane, as the page narrows */
  /* style: 精致产品感 — neutral zinc surfaces, one indigo accent, hairlines + layered soft shadows */
  --bg:#f1f1f4; --glow:rgba(90,85,224,.11);
  --panel:#ffffff; --raised:#ffffff; --sunk:#f8f8fa; --track:rgba(22,22,30,.05);
  --hover:rgba(22,22,30,.045); --press:rgba(22,22,30,.08);
  --line:#e8e8ed; --line-2:#d9d9e1;
  --ink:#16161c; --ink-2:#3b3b46; --muted:#6c6c78; --faint:#a2a2ad;
  --accent:#5a55e0; --accent-solid:#5d58e3; --accent-solid-2:#4c47d1; --on-accent:#ffffff;
  --accent-soft:#f0effe; --accent-line:rgba(90,85,224,.28); --ring:rgba(90,85,224,.5);
  --warn:#9a5a00; --warn-soft:#fdf2df; --danger:#d23c3c; --danger-soft:#fdeeee;
  --toast:#1b1b22; --toast-ink:#f4f4f7;
  --hl:inset 0 1px 0 rgba(255,255,255,.8);
  --topbar:linear-gradient(180deg,#ffffff 0%,#fafafc 100%);
  --shadow-xs:0 1px 1px rgba(16,16,28,.04);
  --shadow-sm:0 1px 2px rgba(16,16,28,.06),0 1px 1px rgba(16,16,28,.03);
  --shadow:0 1px 2px rgba(16,16,28,.05),0 4px 10px -2px rgba(16,16,28,.06),0 12px 28px -10px rgba(16,16,28,.12);
  --shadow-lg:0 1px 2px rgba(16,16,28,.04),0 8px 24px -6px rgba(16,16,28,.10),0 32px 72px -24px rgba(16,16,28,.20);
  --t1:#5a55e0; --t2:#1f9d8b; --t3:#e0812b; --t4:#c79a12; --t5:#9b6bd8;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --display:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08080a; --glow:rgba(120,116,255,.12);
    --panel:#111114; --raised:#1a1a1f; --sunk:#0d0d10; --track:rgba(255,255,255,.055);
    --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
    --line:#232329; --line-2:#303038;
    --ink:#ededf1; --ink-2:#c6c6cf; --muted:#8a8a96; --faint:#5d5d69;
    --accent:#a5a2ff; --accent-solid:#5f5ae8; --accent-solid-2:#6d68f2; --on-accent:#ffffff;
    --accent-soft:rgba(130,125,255,.14); --accent-line:rgba(160,157,255,.34); --ring:rgba(160,157,255,.6);
    --warn:#e8b25c; --warn-soft:rgba(232,178,92,.12); --danger:#ff7b7b; --danger-soft:rgba(255,110,110,.12);
    --toast:#26262d; --toast-ink:#f1f1f5;
    --hl:inset 0 1px 0 rgba(255,255,255,.05);
    --topbar:linear-gradient(180deg,rgba(255,255,255,.035) 0%,rgba(255,255,255,0) 100%);
    --shadow-xs:0 1px 1px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
    --shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35),0 14px 32px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
    --shadow-lg:0 0 0 1px rgba(0,0,0,.4),0 16px 40px -8px rgba(0,0,0,.6),0 40px 90px -30px rgba(0,0,0,.8);
    --t1:#8f8cff; --t2:#3cc3ad; --t3:#f0a05a; --t4:#e0bd4a; --t5:#b993f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08080a; --glow:rgba(120,116,255,.12);
  --panel:#111114; --raised:#1a1a1f; --sunk:#0d0d10; --track:rgba(255,255,255,.055);
  --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --line:#232329; --line-2:#303038;
  --ink:#ededf1; --ink-2:#c6c6cf; --muted:#8a8a96; --faint:#5d5d69;
  --accent:#a5a2ff; --accent-solid:#5f5ae8; --accent-solid-2:#6d68f2; --on-accent:#ffffff;
  --accent-soft:rgba(130,125,255,.14); --accent-line:rgba(160,157,255,.34); --ring:rgba(160,157,255,.6);
  --warn:#e8b25c; --warn-soft:rgba(232,178,92,.12); --danger:#ff7b7b; --danger-soft:rgba(255,110,110,.12);
  --toast:#26262d; --toast-ink:#f1f1f5;
  --hl:inset 0 1px 0 rgba(255,255,255,.05);
  --topbar:linear-gradient(180deg,rgba(255,255,255,.035) 0%,rgba(255,255,255,0) 100%);
  --shadow-xs:0 1px 1px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
  --shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35),0 14px 32px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-lg:0 0 0 1px rgba(0,0,0,.4),0 16px 40px -8px rgba(0,0,0,.6),0 40px 90px -30px rgba(0,0,0,.8);
  --t1:#8f8cff; --t2:#3cc3ad; --t3:#f0a05a; --t4:#e0bd4a; --t5:#b993f0;
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1100px 460px at 50% -240px,var(--glow),transparent 72%) no-repeat,var(--bg);color:var(--ink);font:14px/1.6 var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility}
::selection{background:var(--accent-soft);color:var(--ink)}
.ic{display:inline-block;flex:none;vertical-align:-2px}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:4px 10px;cursor:pointer;transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease)}
button:hover{background:var(--hover)}
button:active{background:var(--press)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
button.on{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;border-color:var(--line-2);background:var(--panel);color:var(--ink-2);font-size:12.5px;font-weight:500;line-height:18px;padding:4px 11px;box-shadow:var(--shadow-xs),var(--hl)}
.btn:hover{background:var(--sunk);border-color:var(--line-2);color:var(--ink)}
.btn:active{transform:translateY(.5px) scale(.985);background:var(--hover)}
.btn.pri{background:linear-gradient(180deg,var(--accent-solid-2),var(--accent-solid));border-color:transparent;color:var(--on-accent);box-shadow:0 1px 2px rgba(60,55,200,.3),0 0 0 1px var(--accent-solid),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.pri:hover{color:var(--on-accent);filter:brightness(1.06)}

/* ---------- demo harness (quiet) ---------- */
.sim{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 20px;font-size:11.5px;color:var(--faint)}
.sim b{color:var(--muted);font-weight:600}
.sim .seg{padding:1px;border-radius:7px}
.sim .seg button{padding:0 9px;font-size:11.5px;line-height:20px;border-radius:6px}
#mode{font-variant-numeric:tabular-nums}

/* segmented controls */
.seg{display:inline-flex;background:var(--track);border:1px solid transparent;border-radius:9px;padding:2px;gap:2px}
.seg button{padding:3px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);line-height:20px}
.seg button:hover{background:transparent;color:var(--ink)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- shell ---------- */
.stage{flex:1;min-height:0;display:flex;padding:0 20px 20px}
.app{display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;transition:width .38s var(--ease)}
.top{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--topbar)}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;padding-right:4px}
.brand .logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#8a86ff 0%,var(--accent-solid) 55%,#3f39c4 100%);box-shadow:0 1px 2px rgba(60,55,200,.35),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(0,0,0,.08)}
.search{flex:1;min-width:120px;position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:10px;top:50%;margin-top:-7px;color:var(--faint);pointer-events:none;transition:color .16s var(--ease)}
.search input{width:100%;font:inherit;font-size:13px;color:inherit;background:var(--track);border:1px solid transparent;border-radius:9px;padding:5px 12px 5px 32px;line-height:20px;transition:background-color .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
.search input::placeholder{color:var(--faint)}
.search input:hover{background:var(--press)}
.search input:focus{outline:none;border-color:var(--accent-line);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.search:focus-within .ic{color:var(--accent)}
.cols{flex:1;min-height:0;display:flex}
.col{min-width:0;overflow:auto;padding:18px 18px 28px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.col::-webkit-scrollbar{width:10px;height:10px}
.col::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.col.side{background:var(--sunk)}
.col h2{font-size:12px;margin:0 0 12px;font-weight:600;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:28px}
.col h2 button{white-space:nowrap;flex:none;font-weight:500;letter-spacing:0;color:var(--ink-2)}
.col h2 > button:not(.btn){width:26px;height:26px;padding:0;display:grid;place-items:center;color:var(--faint)}
.col h2 > button:not(.btn):hover{color:var(--ink)}
.col h2 .btn{padding:3px 10px 3px 8px}

/* resize handles */
.split{flex:0 0 9px;margin:0 -4px;z-index:2;cursor:col-resize;position:relative;touch-action:none}
.split::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line);transition:background-color .16s var(--ease)}
.split::after{content:"";position:absolute;left:2.5px;top:50%;width:4px;height:28px;margin-top:-14px;border-radius:4px;background:var(--line-2);opacity:0;transition:opacity .16s var(--ease),background-color .16s var(--ease),height .22s var(--ease),margin-top .22s var(--ease)}
.split:hover::after,.split.drag::after{opacity:1;background:var(--accent);height:52px;margin-top:-26px;box-shadow:0 0 0 3px var(--accent-soft)}
.split:hover::before,.split.drag::before{background:var(--accent-line)}
.rail{flex:0 0 48px;background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.rail button{width:32px;height:32px;padding:0;display:grid;place-items:center;color:var(--muted)}
.rail button:hover{color:var(--ink)}
.rail .n{font-size:11px;color:var(--accent);writing-mode:vertical-rl;letter-spacing:.12em;background:var(--accent-soft);border-radius:999px;padding:8px 2px;font-weight:500}

/* ---------- filter column ---------- */
.lab{font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 8px;letter-spacing:.04em;padding-top:16px;border-top:1px solid var(--line)}
.tree{list-style:none;margin:0;padding:0}
.trow{display:flex;align-items:center;gap:0;border-radius:8px;transition:background-color .16s var(--ease)}
.trow:hover{background:var(--hover)}
.trow:has(.name.on){background:var(--accent-soft)}
.trow .name{flex:1;text-align:left;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.trow .name:hover,.trow .name.on,.trow .name:active{background:transparent}
.trow .name.on{color:var(--accent)}
.trow .name[data-type]::before{content:"";flex:none;width:7px;height:7px;border-radius:2.5px;background:var(--c,var(--faint));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--faint)) 16%,transparent)}
.name[data-type="实习"]{--c:var(--t1)} .name[data-type="项目"]{--c:var(--t2)} .name[data-type="志愿者"]{--c:var(--t3)} .name[data-type="获奖"]{--c:var(--t4)} .name[data-type="思考"]{--c:var(--t5)}
.trow .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding:0 8px;min-width:26px;text-align:right;font-weight:500}
.trow:has(.name.on) .cnt{color:var(--accent)}
.caret{padding:0;width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--faint);border-radius:6px;margin-left:2px}
.caret:hover{color:var(--ink)}
.caret .ic{transition:transform .2s var(--ease)}
.caret[aria-expanded="true"] .ic{transform:rotate(90deg)}
.sub{list-style:none;margin:2px 0 8px 13px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.sub button{display:block;width:100%;text-align:left;padding:4px 8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:7px;position:relative}
.sub button:hover{color:var(--ink)}
.sub button.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.tree .sub button.on::before{content:"";position:absolute;left:-11px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.sub button .ic{margin-right:7px;color:var(--faint)}
.sub button.on .ic{color:var(--accent)}
.allt{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;border-radius:999px;border-color:var(--line);background:var(--panel);padding:2px 10px 2px 9px;color:var(--ink-2);line-height:18px;box-shadow:var(--shadow-xs)}
.chips button::before{content:"#";color:var(--faint);margin-right:3px;font-weight:500}
.chips button:hover{border-color:var(--line-2);background:var(--sunk);color:var(--ink)}
.chips button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);box-shadow:none}
.chips button.on::before{color:var(--accent)}
.tagbar{margin:0 0 16px}
.add{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent-line);border-radius:12px;padding:12px;margin-bottom:16px;background:var(--panel);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-sm);animation:pop .26s var(--spring) both}
.add input,.add select{font:inherit;font-size:13px;color:inherit;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;min-width:0;line-height:20px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.add input:focus,.add select:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.add .hint{font-size:11.5px;color:var(--muted)}
.card[data-ck],.sub [data-ck]{cursor:pointer}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:linear-gradient(180deg,var(--line-2),var(--line) 85%,transparent)}
.yr{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--ink-2);margin:20px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:.03em;position:relative;display:flex;align-items:center;gap:10px;line-height:20px}
.yr:first-child{margin-top:2px}
.yr::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--faint);box-shadow:0 0 0 3px var(--panel)}
.yr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:11px;padding:10px 12px 11px;margin-bottom:4px;position:relative;transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease)}
.card::before{content:"";position:absolute;left:-20px;top:18px;width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--line-2) 55%,var(--faint));box-shadow:0 0 0 3px var(--panel);transition:background-color .18s var(--ease),box-shadow .2s var(--ease)}
.card:hover{background:var(--hover)}
.card:hover::before{background:var(--faint)}
.card:active{transform:scale(.995)}
.card.on{background:var(--raised);border-color:var(--line);box-shadow:var(--shadow);color:inherit}
.card.on::before{background:var(--accent);box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--accent-soft)}
.card.on.fx{animation:lift .32s var(--ease) both}
.card.on.fx::before{animation:ping .5s var(--ease) both}
.card .t{font-weight:600;overflow-wrap:anywhere;font-size:14px;letter-spacing:-.003em;line-height:1.5}
.card .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.card .ps{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.card .rn{border-radius:8px!important}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel);font-weight:500}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.solid{background:var(--track);border-color:transparent;color:var(--ink-2)}
.pill .ic{color:var(--faint)}
.card.on .pill.solid{background:var(--accent-soft);color:var(--accent)}
.card.on .pill.solid .ic{color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:22px 16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;background:var(--sunk)}

/* ---------- detail ---------- */
.dt{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.35;margin:2px 0 6px;letter-spacing:-.012em;text-wrap:balance;overflow-wrap:anywhere}
.dt .more{color:var(--faint)}
.dm{color:var(--muted);font-size:12.5px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:minmax(40px,max-content) 1fr;gap:0 22px;max-width:68ch;border:1px solid var(--line);border-radius:12px;padding:2px 16px;background:var(--panel);box-shadow:var(--shadow-xs)}
.fields > .k,.fields > .v{padding:11px 0;border-bottom:1px solid var(--line)}
.fields > :nth-last-child(-n+2){border-bottom:none}
.fields .k{font-size:12px;color:var(--muted);letter-spacing:.04em;padding-top:13px;font-weight:500}
.fields .v{overflow-wrap:anywhere;min-width:0;color:var(--ink)}
.fields .v.miss{color:var(--faint);font-size:13px}
.fields .v.miss::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);opacity:.7;margin-right:8px;vertical-align:2px}
.fields .v .pill{margin:0 4px 4px 0}
.sec{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:28px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
.w{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--panel);max-width:72ch;box-shadow:var(--shadow-sm);transition:border-color .18s var(--ease),box-shadow .22s var(--ease)}
.w:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.w .hd{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:11px 12px 0 14px}
.w .hd .ty{font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.w .hd .ty::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent)}
.w.ref .hd .ty::before{background:var(--faint)}
.vers{display:inline-flex;flex-wrap:wrap;gap:2px;flex:0 1 auto;min-width:0;align-items:center;background:var(--track);border-radius:9px;padding:2px}
.vers:empty{display:none}
.vers button[role=tab]{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.w .acts button{font-size:12px}

.w.wide{max-width:none}
.vbody.fx{animation:swap .26s var(--ease) both}
.tog{font-size:12px;color:var(--accent);padding:2px 10px;white-space:nowrap;border-radius:999px;font-weight:500;margin-left:auto}
.tog:hover{background:var(--accent-soft)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec .tog{letter-spacing:0;font-weight:500;border:1px solid var(--accent-line);padding:2px 11px}
.more{padding:0 6px;color:var(--faint);font-size:14px;line-height:20px;border-radius:6px;letter-spacing:.5px}
.more:hover{color:var(--ink)}
.rn{font:inherit;font-size:12px;color:inherit;background:var(--panel);border:1px solid var(--accent);border-radius:7px;padding:1px 9px;width:11em;max-width:100%;line-height:20px;box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:11px;border-radius:0 0 11px 11px;overflow:hidden}
.cmp.fx .cell{animation:rise .34s var(--ease) both}
.cmp.fx .cell:nth-child(2){animation-delay:.04s}
.cmp.fx .cell:nth-child(3){animation-delay:.08s}
.cmp.fx .cell:nth-child(n+4){animation-delay:.12s}
.cmp .cell{background:var(--panel);display:flex;flex-direction:column;min-width:0}
.w.ref .cmp .cell{background:var(--sunk)}
.cmp .ch{display:flex;align-items:center;gap:2px;padding:10px 14px 0;font-size:12px;color:var(--accent);font-weight:600;min-width:0}
.cmp .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:context-menu;background:var(--accent-soft);border-radius:6px;padding:0 8px;line-height:20px}

.vers [data-vk]{cursor:context-menu}
.menu{position:fixed;z-index:10;background:var(--raised);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow-lg);padding:4px;display:flex;flex-direction:column;min-width:168px;transform-origin:top left;animation:menu .16s var(--ease) both}
.menu[hidden]{display:none}
.menu button{text-align:left;font-size:13px;padding:6px 10px;border-radius:7px;color:var(--ink-2)}
.menu button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.menu button:disabled{color:var(--muted);cursor:not-allowed;opacity:.55}
.menu [data-m="del"],.menu [data-cm="del"]{margin-top:5px;position:relative}
.menu [data-m="del"]::before,.menu [data-cm="del"]::before{content:"";position:absolute;left:-4px;right:-4px;top:-3px;height:1px;background:var(--line)}
.menu [data-m="del"]:hover:not(:disabled),.menu [data-cm="del"]:hover{color:var(--danger);background:var(--danger-soft)}
.menu button.danger,.menu button.danger:hover{color:var(--danger);background:var(--danger-soft);font-weight:600}
.w.ref{background:var(--sunk);border-style:dashed;box-shadow:none}
.w.ref:hover{box-shadow:none}

/* application record */
.doc .body{max-width:66ch}
.doc p{margin:0 0 6px;padding:10px 16px;border-left:2px solid transparent;border-radius:0 10px 10px 0;line-height:1.9;transition:background-color .2s var(--ease)}
.doc p.hit{border-left-color:var(--accent);background:var(--accent-soft)}
.detail.fx .doc p.hit,.doc.fx p.hit{animation:flash 1.1s var(--ease) both}
.doc .from{margin:-2px 0 14px 16px}
.doc .from button{font-size:11.5px;border-radius:999px;padding:0 10px 0 8px;color:var(--muted);border-color:var(--line);background:var(--panel);line-height:20px;display:inline-flex;align-items:center;gap:5px}
.doc .from button::before{content:"↳";color:var(--faint)}
.doc .from button:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.doc .from button:hover::before{color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px) scale(.97);background:var(--toast);color:var(--toast-ink);padding:8px 16px 8px 14px;border-radius:999px;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .32s var(--spring);box-shadow:var(--shadow-lg),inset 0 0 0 1px rgba(255,255,255,.06);display:flex;align-items:center;gap:8px}
.toast::before{content:"";width:6px;height:6px;border-radius:50%;background:#8f8cff;box-shadow:0 0 0 3px rgba(143,140,255,.22)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- motion ---------- */
.cols.fx > .col,.cols.fx > .rail{animation:colIn .32s var(--ease) both}
.detail.fx > *{animation:rise .34s var(--ease) both}
.detail.fx > :nth-child(2){animation-delay:.02s}
.detail.fx > :nth-child(3){animation-delay:.04s}
.detail.fx > :nth-child(4){animation-delay:.06s}
.detail.fx > :nth-child(n+5){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateX(4px)}to{opacity:1;transform:none}}
@keyframes colIn{from{opacity:0}to{opacity:1}}
@keyframes lift{from{transform:scale(.985);box-shadow:none}to{transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 3px var(--panel),0 0 0 0 var(--accent-line)}100%{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--accent-soft)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes menu{from{opacity:0;transform:scale(.97) translateY(-3px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (max-width:640px){.stage{padding:0}.app{width:100%!important;border-radius:0;border:none}.sim{padding:6px 12px}}

      <input id="add-time" placeholder="时间，如 2026.09" aria-label="时间" style="flex:1;min-width:110px"></div>
      <div style="display:flex;gap:6px"><button class="btn pri" type="submit">添加</button><button type="button" data-addcancel="1">取消</button></div>
      <div class="hint">这里只建一张空卡片。详细内容可以之后在对话里交给 AI 补充。</div></form>`:'';
  return `<div class="col" style="${fill?'flex:1':`flex:0 0 ${pct('list')};min-width:200px`}">
    <h2>时间线 <span style="display:flex;gap:8px;align-items:center"><span style="font-weight:400;letter-spacing:0">${cs.length} 段${S.type?' · '+S.type:''}</span><button class="btn" data-add="1">${ICON.plus}新增</button></span></h2>
    <div class="chips tagbar" role="group" aria-label="按标签筛选">${tags.map(t=>`<button class="${S.tag===t?'on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    ${add}${h?`<div class="tl">${h}</div>`:'<div class="empty">没有符合条件的经历。换一个类型或标签，或点「新增」。</div>'}</div>`;
}
function vcell(key,w,vi,ref){
  const v=w.versions[vi],ek=key+'#'+vi;
  if(ref)return `<div class="bd">${esc(v.text)}</div><div class="acts"><button class="btn" data-copytext="${esc(v.text)}">复制</button><button class="btn" data-doc="${v.doc}" data-hit="${v.pi}">展开完整文档 →</button></div>`;
  return S.edit===ek?`<div class="bd"><textarea id="ta" aria-label="编辑写法">${esc(v.text)}</textarea></div><div class="acts"><button class="btn pri" data-save="${ek}">保存到当前版本</button><button class="btn" data-savenew="${ek}">另存为新版本</button><button data-cancel="1">取消</button></div>`
    :`<div class="bd">${esc(v.text)}</div><div class="acts"><button class="btn" data-copy="${ek}">复制</button><button class="btn" data-edit="${ek}">编辑</button></div>`;
}
function vname(key,w,vi,ref,tab,on){
  const n=w.versions[vi].name,rn=S.rename===key+'#'+vi;
  if(rn)return `<input id="rn" class="rn" value="${esc(n)}" data-rn="${key}#${vi}" aria-label="版本名称">`;
  const more=!ref&&(on||!tab)?`<button class="more" data-menu="${key}#${vi}" aria-label="版本操作：重命名、复制新版、删除" title="重命名、复制新版、删除">⋯</button>`:'';
  return tab?`<button role="tab" aria-selected="${on}" class="${on?'on':''}" data-ver="${key}" data-vi="${vi}" ${ref?'':`data-vk="${key}#${vi}" title="右键可重命名、复制新版、删除"`}>${esc(n)}</button>${more}`
            :`<span class="vn" ${ref?'':`data-vk="${key}#${vi}" title="右键可重命名、复制新版、删除"`}>${esc(n)}</span>${more}`;
}
function wblock(key,w,ref){
  const vi=Math.min(S.ver[key]||0,w.versions.length-1),many=w.versions.length>1,ex=many&&(S.expAll||S.exp[key]);
  const sw=!ex&&FX.pv[key]!==undefined&&FX.pv[key]!==vi,cl=!ex&&FX.pe[key]===true,ea=ex&&!FX.pe[key]&&!FX.sel;FX.pv[key]=vi;FX.pe[key]=!!ex;
  const tog=many?`<button class="tog" data-exp="${key}">${ex?'收起':`展开 ${w.versions.length} 版对比`}</button>`:'';
  if(ex)return `<div class="w wide ${ref?'ref':''}"><div class="hd"><span class="ty">${esc(w.type)}</span><span class="vers"></span>${tog}</div>
    <div class="cmp${ea?' fx':''}">${w.versions.map((x,j)=>`<div class="cell"><div class="ch">${vname(key,w,j,ref,false,false)}</div>${vcell(key,w,j,ref)}</div>`).join('')}</div></div>`;
  return `<div class="w ${ref?'ref':''}"><div class="hd"><span class="ty">${esc(w.type)}</span>
    <span class="vers" role="tablist" aria-label="${esc(w.type)}的版本">${w.versions.map((x,j)=>vname(key,w,j,ref,true,j===vi)).join('')}</span>${tog}</div><div class="vbody${sw||cl?' fx':''}">${vcell(key,w,vi,ref)}</div></div>`;
}
function refsOf(c){
  const vs=DOCS.flatMap(d=>d.paras.map((p,pi)=>p.card===c.id?{name:d.title,text:p.text,doc:d.id,pi}:null).filter(Boolean));
  return vs.length?{type:'动机信段落',versions:vs}:null;
}
function detailCol(){
  const back=S.mode==='single'?'<button class="btn" data-pane="list">← 时间线</button>':'';
  if(S.doc)return docView(back);
  const c=card(S.sel);
  if(!c)return '<div class="col" style="flex:1"><div class="empty">从左侧选一段经历。</div></div>';
  const f=(k,v,miss)=>`<div class="k">${k}</div><div class="v ${v?'':'miss'}">${v?esc(v):miss}</div>`;
  const r=refsOf(c);
  const ws=c.writings.map((w,i)=>wblock(c.id+':'+i,w,false)).join('')+(r?wblock(c.id+':ref',r,true):'');
  const anyMany=c.writings.some(w=>w.versions.length>1)||(r&&r.versions.length>1);
  return `<div class="col detail${FX.sel?' fx':''}" style="flex:1;min-width:0">${back?`<div style="margin-bottom:10px">${back}</div>`:''}
    <h1 class="dt">${esc(c.title)} <button class="more" style="font-size:18px;vertical-align:middle" data-cmenu="${c.id}" aria-label="经历操作：重命名、复制、删除" title="重命名、复制、删除">⋯</button></h1>
    <div class="dm"><span>${esc(c.time)}</span>${c.role?`<span>·</span><span>${esc(c.role)}</span>`:''}${c.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>
    <div class="fields">${f('事实',c.fact,'还没有记录。回到对话补充做了什么。')}${f('结果',c.result,'还没有记录。回到对话补充数字或证明材料。')}${f('思考',c.thought,'还没有记录。回到对话补充这段经历让你想到了什么。')}
    <div class="k">作品</div><div class="v">${c.works.length?c.works.map(w=>`<span class="pill solid">${esc(w)}</span>`).join(''):'<span style="color:var(--muted)">无</span>'}</div></div>
    <div class="sec"><span>已有写法</span>${anyMany?`<button class="tog" data-expall="1">${S.expAll?'全部收起':'全部展开对比'}</button>`:''}</div>${ws||'<div class="empty">还没有写法。回到对话，让 AI 按某次申请的要求生成。</div>'}</div>`;
}
function docView(back){
  const d=DOCS.find(x=>x.id===S.doc);
  return `<div class="col doc detail${FX.sel?' fx':''}" style="flex:1;min-width:0"><div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">${back}<button class="btn" data-back="1">← 返回卡片</button></div>
    <h1 class="dt">${esc(d.title)}</h1>
    <div class="dm"><span class="pill solid">${d.kind}</span><span class="pill">申请对象：${esc(d.target)}</span><span class="pill">场景：${d.scene}</span><span class="pill">${d.date}</span><span class="pill">${d.lang}</span></div>
    <div class="body">${d.paras.map((p,i)=>`<p class="${S.hit===i?'hit':''}">${esc(p.text)}</p>${p.card?`<div class="from"><button data-sel="${p.card}">用到的经历：${esc(card(p.card).title)}</button></div>`:''}`).join('')}</div>
    <div style="margin-top:14px"><button class="btn" data-copytext="${esc(d.paras.map(p=>p.text).join('\n\n'))}">复制全文</button></div></div>`;
}
function render(){
  const single=S.mode==='single',parts=[];
  const fOpen=S.show.filter&&S.mode==='wide';
  let showList=S.show.list,showDetail=S.show.detail;
  if(single){showList=S.pane==='list';showDetail=!showList}
  const railNav=single&&S.show.filter&&S.pane==='filter';
  const fk=S.doc?'d:'+S.doc:'c:'+S.sel;FX.sel=fk!==FX.k;FX.k=fk;
  const sig=[S.mode,railNav,fOpen,showList,showDetail].join();$('cols').classList.toggle('fx',sig!==FX.sig);FX.sig=sig;
  if(railNav){$('cols').innerHTML=filterCol(true).replace('flex:0 0 '+pct('filter')+';min-width:150px','flex:1');sync();return}
  parts.push(filterCol(fOpen));
  if(fOpen&&(showList||showDetail))parts.push('<div class="split" data-split="filter" role="separator" aria-label="拖拽调整筛选栏宽度，双击恢复默认" title="拖拽调整宽度，双击恢复默认"></div>');
  if(showList)parts.push(listCol(!showDetail));
  if(showList&&showDetail)parts.push('<div class="split" data-split="list" role="separator" aria-label="拖拽调整时间线和详情的宽度，双击恢复默认" title="拖拽调整宽度，双击恢复默认"></div>');
  if(showDetail)parts.push(detailCol());
  if(!showList&&!showDetail)parts.push('<div class="col" style="flex:1"><div class="empty">时间线和详情都已隐藏。用上方按钮重新显示。</div></div>');
  $('cols').innerHTML=parts.join('');sync();
  const ta=$('ta');if(ta)ta.focus();
  const rn=$('rn');if(rn){rn.focus();rn.select()}
  const at=$('add-title');if(at&&document.activeElement!==at&&!rn&&!$('ta')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT')at.focus();
}
function sync(){
  const single=S.mode==='single';
  $('tg-filter').classList.toggle('on',single?S.pane==='filter':S.show.filter&&S.mode==='wide');
  $('tg-list').classList.toggle('on',single?S.pane==='list':S.show.list);
  $('tg-detail').classList.toggle('on',single?S.pane==='detail':S.show.detail);
  $('mode').textContent={wide:'当前布局：三栏',mid:'当前布局：筛选栏自动收起',single:'当前布局：单栏，用右上角按钮切换'}[S.mode];
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function copy(text){try{navigator.clipboard.writeText(text).then(()=>toast('已复制'),()=>toast('复制被浏览器拒绝，请手动选中文字'))}catch(e){toast('复制被浏览器拒绝，请手动选中文字')}}
function wv(ek){const[key,v]=ek.split('#'),[cid,i]=key.split(':');return{key,w:card(cid).writings[+i],vi:+v}}
function menuHtml(){const m=S.menu;if(!m)return '';
  if(m.card)return `<button data-cm="rename">重命名</button><button data-cm="dup">复制为新经历</button><button data-cm="del" class="${m.confirm?'danger':''}">${m.confirm?'再点一次确认删除':'删除'}</button>`;
  const{w}=wv(m.ek);
  return `<button data-m="rename">重命名</button><button data-m="dup">复制为新版本</button><button data-m="del" ${w.versions.length<2?'disabled title="至少保留一个版本"':''} class="${m.confirm?'danger':''}">${m.confirm?'再点一次确认删除':'删除'}</button>`}
function showMenu(){const el=$('menu'),m=S.menu;if(!m){el.hidden=true;return}
  el.innerHTML=menuHtml();el.hidden=false;const W=el.offsetWidth,H=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(innerWidth-W-8,m.x))+'px';el.style.top=Math.max(8,Math.min(innerHeight-H-8,m.y))+'px';
  if(!m.confirm)el.querySelector('button').focus()}
function commitRename(inp){if(!S.rename)return;const n=inp.value.trim();if(S.rename.startsWith('card#')){const c=card(S.rename.slice(5));if(n&&c)c.title=n}else{const{w,vi}=wv(S.rename);if(n)w.versions[vi].name=n}S.rename=null}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(S.menu&&!(b&&(b.dataset.m||b.dataset.cm||b.dataset.menu||b.dataset.cmenu))){S.menu=null;showMenu()}
  if(!b)return;const d=b.dataset,single=S.mode==='single';
  if(d.menu){const r=b.getBoundingClientRect();S.menu=S.menu&&S.menu.ek===d.menu?null:{ek:d.menu,x:r.left,y:r.bottom+4};showMenu();return}
  if(d.cmenu){const r=b.getBoundingClientRect();S.menu=S.menu&&S.menu.card===d.cmenu?null:{card:d.cmenu,x:r.left,y:r.bottom+4};showMenu();return}
  if(d.cm){const m=S.menu,c=card(m.card),i=CARDS.indexOf(c);
    if(d.cm==='del'&&!m.confirm){m.confirm=true;showMenu();return}
    if(d.cm==='rename'){S.rename='card#'+c.id;S.show.list=true;if(S.mode==='single')S.pane='list'}
    else if(d.cm==='dup'){const n=JSON.parse(JSON.stringify(c));n.id='c'+Date.now();n.title=c.title+' 副本';CARDS.splice(i+1,0,n);S.sel=n.id;S.doc=null;toast('已复制为新经历')}
    else if(d.cm==='del'){CARDS.splice(i,1);DOCS.forEach(x=>x.paras.forEach(p=>{if(p.card===c.id)p.card=null}));if(S.sel===c.id){const v=visible()[0]||CARDS[0];S.sel=v?v.id:null}toast('已删除这段经历')}
    S.menu=null;showMenu();render();return}
  if(d.m){const m=S.menu,{key,w,vi}=wv(m.ek);
    if(d.m==='del'&&!m.confirm){m.confirm=true;showMenu();return}
    if(d.m==='rename'){S.rename=m.ek;S.edit=null}
    else if(d.m==='dup'){w.versions.splice(vi+1,0,{name:w.versions[vi].name+' 副本',text:w.versions[vi].text});S.ver[key]=vi+1;toast('已复制为新版本')}
    else if(d.m==='del'){w.versions.splice(vi,1);S.ver[key]=Math.max(0,Math.min(S.ver[key]||0,w.versions.length-1));S.edit=null;toast('已删除这个版本')}
    S.menu=null;showMenu();render();return}
  if(d.ratio){$('app').style.width=d.ratio+'%';document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.toggle('on',x===b));return}
  if(d.toggle){
    if(single)S.pane=d.toggle;
    else if(d.toggle==='filter'&&S.mode==='mid'){S.mode='wide';S.show.filter=true;S.pin=true}
    else{S.show[d.toggle]=!S.show[d.toggle];
      if(d.toggle==='list'&&!S.show.list){S.show.filter=true;if(S.mode==='mid'){S.mode='wide';S.pin=true}if(S.type)S.open[S.type]=true;else TYPES.forEach(t=>S.open[t]=true)}}}
  else if(d.pane)S.pane=d.pane;
  else if(d.open)S.open[d.open]=!S.open[d.open];
  else if(d.type){S.type=S.type===d.type?null:d.type;if(single)S.pane='list'}
  else if(d.tag){S.tag=S.tag===d.tag?null:d.tag;if(single)S.pane='list'}
  else if(d.alltypes){S.type=null;if(single)S.pane='list'}
  else if(d.add){S.adding=!S.adding}
  else if(d.addcancel){S.adding=false}
  else if(d.sel){S.sel=d.sel;S.doc=null;S.edit=null;S.show.detail=true;S.pane='detail'}
  else if(d.doc){S.doc=d.doc;S.hit=d.hit!==undefined?+d.hit:null;S.show.detail=true;S.pane='detail'}
  else if(d.back){S.doc=null}
  else if(d.ver){S.ver[d.ver]=+d.vi;S.edit=null}
  else if(d.exp){S.exp[d.exp]=!(S.expAll||S.exp[d.exp]);if(S.expAll){S.expAll=false;card(S.sel).writings.forEach((w,i)=>S.exp[S.sel+':'+i]=true);S.exp[S.sel+':ref']=true;S.exp[d.exp]=false}}
  else if(d.expall){S.expAll=!S.expAll;if(!S.expAll)S.exp={}}
  else if(d.edit)S.edit=d.edit;
  else if(d.cancel)S.edit=null;
  else if(d.save){const{w,vi}=wv(d.save);w.versions[vi].text=$('ta').value;S.edit=null;toast('已保存到当前版本')}
  else if(d.savenew){const{key,w}=wv(d.savenew);w.versions.push({name:'v'+(w.versions.length+1)+' 新版本',text:$('ta').value});S.ver[key]=w.versions.length-1;S.edit=null;toast('已另存为新版本')}
  else if(d.copy){const{w,vi}=wv(d.copy);copy(w.versions[vi].text);return}
  else if(d.copytext){copy(d.copytext);return}
  else return;
  render();
});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-vk],[data-ck]');if(!t)return;e.preventDefault();
  S.menu=t.dataset.vk?{ek:t.dataset.vk,x:e.clientX,y:e.clientY}:{card:t.dataset.ck,x:e.clientX,y:e.clientY};showMenu()});
document.addEventListener('submit',e=>{if(e.target.id!=='addf')return;e.preventDefault();const title=$('add-title').value.trim();if(!title)return;
  const time=$('add-time').value.trim()||'2026.11',y=parseInt(time,10);
  const c={id:'c'+Date.now(),type:$('add-type').value,org:title.split(/[·・]/)[0].trim(),title,time,year:y>1900?y:2026,role:'',tags:[],fact:'',result:'',thought:'',works:[],writings:[]};
  CARDS.push(c);S.sel=c.id;S.doc=null;S.adding=false;if(S.type&&S.type!==c.type)S.type=null;S.tag=null;toast('已新增一段经历');render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.menu){S.menu=null;showMenu()}if(S.rename){S.rename=null;render()}}
  if(e.key==='Enter'&&e.target.id==='rn'){commitRename(e.target);render()}});
document.addEventListener('focusout',e=>{if(e.target.id==='rn'&&S.rename){commitRename(e.target);render()}});
$('q').addEventListener('input',e=>{S.q=e.target.value;if(S.mode==='single')S.pane='list';render()});
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.split');if(!s)return;drag={k:s.dataset.split,x:e.clientX,f:S.f[s.dataset.split],el:s,W:$('cols').clientWidth};s.classList.add('drag');s.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const other=drag.k==='filter'?(S.show.list?S.f.list:0):(S.show.filter&&S.mode==='wide'?S.f.filter:0);
  const min=(drag.k==='filter'?150:200)/drag.W,max=1-other-240/drag.W;
  S.f[drag.k]=Math.max(min,Math.min(max,drag.f+(e.clientX-drag.x)/drag.W));
  const col=drag.el.previousElementSibling;if(col)col.style.flexBasis=pct(drag.k)});
document.addEventListener('pointerup',()=>{if(drag){drag.el.classList.remove('drag');drag=null}});
document.addEventListener('dblclick',e=>{const s=e.target.closest('.split');if(s){S.f[s.dataset.split]=DEF[s.dataset.split];render()}});
new ResizeObserver(([en])=>{const w=en.contentRect.width,m=w<520?'single':w<820?'mid':'wide';
  if(m==='wide')S.pin=false;
  if(S.pin&&m==='mid')return;
  if(m!==S.mode){S.mode=m;if(m==='single')S.pane=S.doc||S.sel?'detail':'list';render()}}).observe($('cols'));
render();
</script>
</body>
