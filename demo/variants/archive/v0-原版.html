html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:7px;padding:4px 10px;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button:hover{background:var(--sunk)}

.split:hover::after,.split.drag::after{background:var(--accent);height:56px;margin-top:-28px}

.rail{flex:0 0 44px;background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}

.card[data-ck],.sub [data-ck]{cursor:pointer}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.yr{font-family:var(--display);font-size:15px;font-weight:600;margin:14px 0 8px;font-variant-numeric:tabular-nums;position:relative}
.yr:first-child{margin-top:0}
.yr::before{content:"";position:absolute;left:-18px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1.5px solid var(--muted)}
.card{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:10px 12px;margin-bottom:4px;position:relative}
.card::before{content:"";position:absolute;left:-16.5px;top:18px;width:5px;height:5px;border-radius:50%;background:var(--line)}

.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}

.cmp .cell{background:var(--panel);display:flex;flex-direction:column;min-width:0}
.w.ref .cmp .cell{background:var(--sunk)}
.cmp .ch{display:flex;align-items:center;gap:2px;padding:8px 14px 0;font-size:12px;color:var(--accent);font-weight:600;min-width:0}
.cmp .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:context-menu}
.cmp .bd{flex:1}
.vers [data-vk]{cursor:context-menu}
.menu{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;min-width:140px}

.doc p{margin:0 0 6px;padding:8px 14px;border-left:2px solid transparent;border-radius:0 8px 8px 0;line-height:1.85}

.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){.stage{padding:0}.app{width:100%!important;border-radius:0;border:none}}
</style>

let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.split');if(!s)return;drag={k:s.dataset.split,x:e.clientX,f:S.f[s.dataset.split],el:s,W:$('cols').clientWidth};s.classList.add('drag');s.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const other=drag.k==='filter'?(S.show.list?S.f.list:0):(S.show.filter&&S.mode==='wide'?S.f.filter:0);
  const min=(drag.k==='filter'?150:200)/drag.W,max=1-other-240/drag.W;
  S.f[drag.k]=Math.max(min,Math.min(max,drag.f+(e.clientX-drag.x)/drag.W));
  const col=drag.el.previousElementSibling;if(col)col.style.flexBasis=pct(drag.k)});
document.addEventListener('pointerup',()=>{if(drag){drag.el.classList.remove('drag');drag=null}});
document.addEventListener('dblclick',e=>{const s=e.target.closest('.split');if(s){S.f[s.dataset.split]=DEF[s.dataset.split];render()}});
new ResizeObserver(([en])=>{const w=en.contentRect.width,m=w<520?'single':w<820?'mid':'wide';
  if(m==='wide')S.pin=false;
  if(S.pin&&m==='mid')return;
  if(m!==S.mode){S.mode=m;if(m==='single')S.pane=S.doc||S.sel?'detail':'list';render()}}).observe($('cols'));
render();
</script>
</body>
</html>
