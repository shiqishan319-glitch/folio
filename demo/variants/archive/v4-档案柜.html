<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经历库 Demo · 档案柜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 档案柜 · 卡片目录 — a quiet contemporary library catalog.
   One material (off-white index cards on pale stone), one accent (the oxblood index-card rule), type does the rest. */
:root{
  --bg:#eeece6; --panel:#fbfaf6; --sunk:#f3f1eb; --line:#dcd8ce; --line-2:#c6c1b5; --rule:#e8e5dd;
  --ink:#1f1e1b; --muted:#736f66; --faint:#a19c91;
  --accent:#8b3a2f; --accent-soft:#f4e8e4; --warn:#8b3a2f; --warn-soft:#f4e8e4;
  --shadow:0 1px 2px rgba(35,30,20,.05),0 2px 6px rgba(35,30,20,.035);
  --lift:0 1px 2px rgba(35,30,20,.06),0 12px 28px rgba(35,30,20,.10);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --display:"Source Serif 4","Noto Serif SC","Songti SC","STSong",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191816; --panel:#262420; --sunk:#201f1c; --line:#38352f; --line-2:#4d4941; --rule:#2f2d28;
    --ink:#e9e5db; --muted:#a19c91; --faint:#6f6b63;
    --accent:#cf8677; --accent-soft:#3a2723; --warn:#cf8677; --warn-soft:#3a2723;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.2);
    --lift:0 1px 2px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191816; --panel:#262420; --sunk:#201f1c; --line:#38352f; --line-2:#4d4941; --rule:#2f2d28;
  --ink:#e9e5db; --muted:#a19c91; --faint:#6f6b63;
  --accent:#cf8677; --accent-soft:#3a2723; --warn:#cf8677; --warn-soft:#3a2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.2);
  --lift:0 1px 2px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:2px;padding:4px 10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .2s,transform .2s}
button:hover{background:var(--sunk)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
button.on{color:var(--ink);font-weight:600}
.btn{border-color:var(--line);background:var(--panel);font-size:12.5px;padding:3px 11px}
.btn:hover{border-color:var(--line-2);background:var(--panel)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.pri:hover{background:var(--ink);color:var(--panel);opacity:.88}

/* Demo 控制条 */
.sim{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 20px;font:11px/1.5 var(--mono);color:var(--faint)}
.sim b{color:var(--muted);font-weight:500}
.seg{display:inline-flex;gap:2px}
.sim .seg button{padding:0 7px;font-size:11px;color:var(--faint)}
.sim .seg button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -1px 0 var(--ink);background:none}

/* frame */
.stage{flex:1;min-height:0;display:flex;padding:0 20px 20px}
.app{display:flex;flex-direction:column;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden;container-type:inline-size}
.top{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:600 19px/1.2 var(--display);letter-spacing:.06em;white-space:nowrap}
.brand-sub{font:10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-left:-6px;padding-left:12px;border-left:1px solid var(--line)}
.top input{flex:1;min-width:120px;font:inherit;font-size:13.5px;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:6px 12px}
.top input::placeholder{color:var(--faint)}
.top input:focus{border-color:var(--line-2);outline:none}
.top .seg button{padding:3px 4px;margin:0 6px;font-size:13px;color:var(--muted);border-radius:0}
.top .seg button:hover{background:none;color:var(--ink)}
.top .seg button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -1.5px 0 var(--ink)}
.cols{flex:1;min-height:0;display:flex}
.col{min-width:0;overflow:auto;padding:20px 20px 28px}
.col h2{font:500 10.5px var(--mono);margin:0 0 14px;letter-spacing:.18em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:26px;text-transform:uppercase}
.col h2 button{white-space:nowrap;flex:none;font-weight:400;letter-spacing:0;color:var(--muted);text-transform:none}
.split{flex:0 0 9px;margin:0 -4px;z-index:2;cursor:col-resize;position:relative;touch-action:none}
.split::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line)}
.split::after{content:"";position:absolute;left:3px;top:50%;width:3px;height:28px;margin-top:-14px;border-radius:2px;background:var(--line-2);opacity:0;transition:opacity .15s,height .15s}
.split:hover::after,.split.drag::after{opacity:1;background:var(--ink);height:48px;margin-top:-24px}
.split:hover::before,.split.drag::before{background:var(--line-2)}

/* drawer index (left) */
.rail{flex:0 0 44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0}
.rail button{color:var(--muted);padding:2px 6px}
.rail .n{font:11px var(--mono);color:var(--ink);writing-mode:vertical-rl;letter-spacing:.1em}
.rail .rl{margin-top:auto;writing-mode:vertical-rl;font:10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.lab{font:500 10.5px var(--mono);color:var(--muted);margin:28px 0 8px;letter-spacing:.18em}
.tree{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:2px}
.trow .name{flex:1;text-align:left;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.trow .name:hover{background:none;color:var(--ink)}
.trow .cnt{font:11.5px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;padding-right:2px}
.caret{padding:2px 0;width:16px;color:var(--faint);font-size:7.5px}
.caret:hover{background:none;color:var(--ink)}
.side > .trow{margin-bottom:10px}
.side > .trow .allt{font-size:13px;color:var(--muted);padding-left:0}
.side > .trow .allt.on{color:var(--ink);font-weight:600}
.tree > li.dw{border-bottom:1px solid var(--rule)}
.ix{flex:none;display:inline-grid;place-items:center;width:18px;height:17px;font:500 10px var(--mono);color:var(--muted);border:1px solid var(--line-2);border-bottom:none;border-radius:3px 3px 0 0;box-shadow:0 1px 0 var(--line-2)}
.dw .name{font-size:14px}
.dw .name.on{color:var(--ink);font-weight:600}
.dw .name.on .ix{background:var(--ink);border-color:var(--ink);color:var(--panel);box-shadow:0 1px 0 var(--ink)}
.sub{list-style:none;margin:0;padding:0}
.sub button{display:block;width:100%;text-align:left;padding:3px 10px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub button:hover{background:none;color:var(--ink)}
.dw .sub{margin:0 0 10px 23px;border-left:1px solid var(--line)}
.dw .sub button{border-radius:0;margin-left:-1px;border-left:1px solid transparent}
.dw .sub button.on{color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.docs{border-top:1px solid var(--line)}
.docs li{border-bottom:1px solid var(--rule)}
.docs button{display:flex;gap:9px;align-items:flex-start;white-space:normal;padding:8px 2px;line-height:1.45}
.docs button.on{color:var(--ink);font-weight:600}
.docs .ico{flex:none;width:13px;height:13px;margin-top:3px;opacity:.7}

/* card drawer (timeline) */
.tray h2 > span{font:11.5px var(--mono);text-transform:none;letter-spacing:.02em;flex-wrap:wrap}
.tray h2{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:12px;border-color:var(--line);color:var(--muted);padding:1px 9px}
.chips button:hover{background:var(--panel);color:var(--ink)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:500}
.tagbar{margin:0 0 20px}
.add{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line-2);border-radius:3px;padding:12px 14px;margin-bottom:18px;background:var(--panel)}
.add::before{content:"新卡片 — 待编目";font:10.5px var(--mono);letter-spacing:.12em;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--accent)}
.add input,.add select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:4px 8px;min-width:0}
.add .hint{font-size:11.5px;color:var(--muted)}
.card[data-ck],.sub [data-ck]{cursor:pointer}
.tl{position:relative;padding:0 0 6px}
.yr{position:relative;height:24px;margin:26px 0 14px;border-bottom:1px solid var(--line-2)}
.yr:first-child{margin-top:4px}
.yr span{position:absolute;bottom:-1px;left:0;padding:2px 12px 1px;background:var(--sunk);border:1px solid var(--line-2);border-bottom-color:var(--sunk);border-radius:3px 3px 0 0;font:600 13px/1.3 var(--display);letter-spacing:.06em;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.card{display:block;width:100%;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 16px 22px;margin:0 0 12px;position:relative;box-shadow:var(--shadow),0 3px 0 -1px var(--panel),0 3px 0 0 var(--line)}
.card::after{content:"";position:absolute;left:50%;bottom:8px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.card:hover{background:var(--panel);border-color:var(--line-2)}
.card.on,button.card.on{background:var(--panel);color:var(--ink);font-weight:inherit;border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--lift),inset 2px 0 0 var(--ink)}
.cno{display:flex;justify-content:space-between;gap:8px;font:10.5px var(--mono);letter-spacing:.06em;color:var(--faint);padding:9px 0 6px;margin-bottom:9px;border-bottom:1px solid var(--accent)}
.card.on .cno{color:var(--muted)}
.card .t{font:600 15.5px/1.45 var(--display);overflow-wrap:anywhere}
.card .m{font:11.5px var(--mono);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.card .ps{margin-top:9px;display:flex;flex-wrap:wrap;gap:2px 12px;padding-right:48px}
.pill{display:inline-block;font-size:11.5px;line-height:18px;color:var(--muted);white-space:nowrap}
.pill.solid{color:var(--ink);font-weight:500}
.pill.warn{color:var(--warn)}
.stamp{display:inline-flex;flex-direction:column;align-items:center;font:500 10px/1.25 var(--font);letter-spacing:.18em;padding:1px 3px 1px 5px;color:var(--faint);border:1px solid currentColor;border-radius:2px;transform:rotate(-2deg);white-space:nowrap;pointer-events:none;user-select:none}
.stamp.warn{color:var(--accent);opacity:.85}
.card .stamp{position:absolute;right:12px;bottom:8px}
.stamp.big{font-size:11.5px;padding:2px 5px 2px 8px;letter-spacing:.24em;border:3px double currentColor}
.stamp small{font:10px var(--mono);letter-spacing:.08em;margin-top:1px}
.empty{color:var(--muted);font-size:13px;padding:16px;border:1px dashed var(--line-2);border-radius:3px}

/* detail: the record card */
.col.desk{padding:22px 32px 36px}
.folder{position:relative;margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:0 3px 3px 3px;box-shadow:var(--shadow);padding:28px 32px 18px;max-width:780px}
.ftab{position:absolute;bottom:calc(100% - 1px);left:-1px;display:flex;gap:10px;align-items:baseline;padding:4px 14px 2px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;font:11px var(--mono);letter-spacing:.06em;color:var(--muted)}
.ftab .fty{font-family:var(--font);color:var(--faint)}
.folder > .stamp{position:absolute;top:28px;right:30px}
.dt{font:600 26px/1.3 var(--display);letter-spacing:.01em;margin:0 0 8px;text-wrap:balance;overflow-wrap:anywhere;padding-right:90px}
.dt .more{color:var(--faint)}
.dm{color:var(--muted);font:12px var(--mono);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums}
.dm .pill{font-family:var(--font);font-size:12px}
.regcard{border-top:1px solid var(--accent);padding-top:4px}
.fields{display:grid;grid-template-columns:minmax(40px,max-content) 1fr;gap:0 28px}
.fields .k,.fields .v{padding:12px 0 11px;border-bottom:1px solid var(--rule)}
.fields .k:nth-last-child(2),.fields .v:last-child{border-bottom:none}
.fields .k{font-size:13px;color:var(--muted);white-space:nowrap;line-height:1.6}
.fields .k small{display:block;font:9.5px var(--mono);letter-spacing:.16em;color:var(--faint)}
.fields .v{overflow-wrap:anywhere;min-width:0;line-height:1.8;font-size:14.5px}
.fields .v.miss{color:var(--faint);font-size:13.5px}
.fields .v.miss::before{content:"待补";display:inline-block;font:500 10px/1.3 var(--font);letter-spacing:.16em;color:var(--accent);border:1px solid currentColor;border-radius:2px;padding:0 3px 0 5px;margin-right:9px;vertical-align:1px;transform:rotate(-2deg)}
.fields .v .pill{margin:0 6px 6px 0}
.att{display:inline-flex!important;align-items:center;gap:5px;font-weight:400!important;color:var(--ink)!important;border:1px solid var(--line);border-radius:2px;padding:0 8px!important;font-size:12px!important;line-height:22px!important}
.att svg{width:9px;height:12px;flex:none;color:var(--faint)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 16px var(--display);color:var(--ink);margin:36px 0 14px;max-width:780px}
.sec .tog{letter-spacing:0;font-weight:400}

/* writings: tabbed cards */
.w{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:14px;max-width:780px;box-shadow:var(--shadow);overflow:hidden}
.w .hd{position:relative;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;padding:9px 16px 0;background:var(--sunk);border-bottom:1px solid var(--line)}
.w .hd:has(> .tog){padding-right:128px}
.w .hd > .tog{position:absolute;top:9px;right:12px;margin:0}
.w .hd .ty{font-weight:600;font-size:13px;align-self:center;margin-bottom:8px}
.vers{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 180px;min-width:0;align-items:flex-end;margin-bottom:-1px}
.vers button[role=tab]{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vers button{font:11.5px/18px var(--mono);padding:5px 11px 5px;border:1px solid transparent;border-bottom:none;border-radius:3px 3px 0 0;color:var(--muted)}
.vers button:hover{background:none;color:var(--ink)}
.vers button.on{background:var(--panel);color:var(--ink);font-weight:500;border-color:var(--line);padding-bottom:6px;position:relative;z-index:1}
.vers button.on:has(+ .more){border-top-right-radius:0;border-right:none}
.vers .more{font-size:12px;padding:5px 7px 6px;margin-left:-2px;background:var(--panel);border-color:var(--line);border-left:none;border-radius:0 3px 0 0;color:var(--faint);position:relative;z-index:1}
.vers .more:hover{background:var(--panel);color:var(--ink)}
.w .bd{padding:14px 18px 10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:14.5px}
.w textarea{width:100%;min-height:110px;font:inherit;line-height:1.8;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:8px 10px;resize:vertical}
.w .acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 14px}
.w .acts button{font-size:12.5px}
.w.wide{max-width:none}
.tog{font:11.5px var(--mono);color:var(--muted);padding:1px 6px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.tog:hover{background:none;color:var(--ink);text-decoration-color:var(--ink)}
.more{padding:0 5px;color:var(--muted);font-size:13px;line-height:18px}
.rn{font:inherit;font-size:12px;color:inherit;background:var(--panel);border:1px solid var(--line-2);border-radius:2px;padding:0 9px;width:11em;max-width:100%}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0}
.cmp .cell{background:var(--panel);display:flex;flex-direction:column;min-width:0;box-shadow:-1px 0 0 var(--line)}
.w.ref .cmp .cell{background:var(--sunk)}
.cmp .ch{display:flex;align-items:center;gap:2px;padding:10px 18px 0;font:500 11.5px var(--mono);color:var(--ink);min-width:0}
.cmp .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:context-menu}
.cmp .bd{flex:1}
.vers [data-vk]{cursor:context-menu}
.w.ref{background:var(--sunk);border-style:dashed;box-shadow:none}
.w.ref .hd{background:transparent}
.w.ref .hd::after{content:"副本 · 摘自申请记录";font:10px var(--mono);letter-spacing:.12em;color:var(--faint);align-self:center;margin-bottom:8px}
.w.ref .vers button.on,.w.ref .vers .more{background:var(--sunk)}

/* menus + toast */
.menu{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);border-top:1px solid var(--accent);border-radius:2px;box-shadow:var(--lift);padding:4px;display:flex;flex-direction:column;min-width:150px}
.menu[hidden]{display:none}
.menu button{text-align:left;font-size:13px;padding:5px 10px}
.menu button:disabled{color:var(--faint);cursor:not-allowed;background:none}
.menu button.danger{color:var(--accent);background:var(--accent-soft);font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:7px 16px;border-radius:2px;font:12px var(--mono);letter-spacing:.06em;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--lift)}
.toast.show{opacity:1}

/* application record: a typed archival document */
.doc .sheet{position:relative;max-width:780px;background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:var(--lift);padding:30px 44px 32px 64px;margin-top:4px}
.doc .sheet::before,.doc .sheet::after{content:"";position:absolute;left:26px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.doc .sheet::before{top:22%}.doc .sheet::after{top:74%}
.shead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:10.5px var(--mono);letter-spacing:.14em;color:var(--muted);padding-bottom:10px;margin-bottom:24px;border-bottom:1px solid var(--accent)}
.shead .no{color:var(--ink)}
.sheet > .stamp{position:absolute;top:58px;right:40px}
.doc .dt{padding-right:110px}
.doc .body{max-width:62ch}
.doc p{margin:0 0 4px;padding:8px 14px 8px 16px;margin-left:-16px;border-left:2px solid transparent;line-height:1.95;font-size:14.5px}
.doc p.hit{border-left-color:var(--accent);background:var(--accent-soft)}
.doc .from{margin:0 0 14px}
.doc .from button{font:11px var(--mono);padding:0;color:var(--faint)}
.doc .from button::before{content:"↳ "}
.doc .from button:hover{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

@container (max-width:820px){.brand-sub{display:none}}
@container (max-width:520px){
  .col.desk{padding:18px 16px 28px}
  .folder{padding:22px 18px 16px}.dt{padding-right:0;padding-top:28px}.doc .dt{padding-right:0;padding-top:24px}
  .folder > .stamp{top:16px;right:16px}.sheet > .stamp{top:48px;right:18px}
  .doc .sheet{padding:22px 18px 22px 40px}.doc .sheet::before,.doc .sheet::after{left:15px}
  .fields{gap:0 16px}
  .w .hd:has(> .tog){padding-right:16px}
  .w .hd > .tog{position:static;margin:0 0 8px auto;align-self:center}
  .w .hd .vers{order:1;flex-basis:100%}
  .vers button{padding-left:8px;padding-right:8px}

    <article class="sheet"><div class="shead"><span>申请记录 · 归档文件</span><span class="no">No. A-${esc(d.date.replace('.','-'))}</span></div><span class="stamp big" aria-hidden="true">已归档<small>${esc(d.date)}</small></span>
    <h1 class="dt">${esc(d.title)}</h1>
    <div class="dm"><span class="pill solid">${d.kind}</span><span class="pill">申请对象：${esc(d.target)}</span><span class="pill">场景：${d.scene}</span><span class="pill">${d.date}</span><span class="pill">${d.lang}</span></div>
    <div class="body">${d.paras.map((p,i)=>`<p class="${S.hit===i?'hit':''}">${esc(p.text)}</p>${p.card?`<div class="from"><button data-sel="${p.card}">用到的经历：${esc(card(p.card).title)}</button></div>`:''}`).join('')}</div>
    <div style="margin-top:14px"><button class="btn" data-copytext="${esc(d.paras.map(p=>p.text).join('\n\n'))}">复制全文</button></div></article></div>`;
}
function render(){
  const single=S.mode==='single',parts=[];
  const fOpen=S.show.filter&&S.mode==='wide';
  let showList=S.show.list,showDetail=S.show.detail;
  if(single){showList=S.pane==='list';showDetail=!showList}
  const railNav=single&&S.show.filter&&S.pane==='filter';
  if(railNav){$('cols').innerHTML=filterCol(true).replace('flex:0 0 '+pct('filter')+';min-width:150px','flex:1');sync();return}
  parts.push(filterCol(fOpen));
  if(fOpen&&(showList||showDetail))parts.push('<div class="split" data-split="filter" role="separator" aria-label="拖拽调整筛选栏宽度，双击恢复默认" title="拖拽调整宽度，双击恢复默认"></div>');
  if(showList)parts.push(listCol(!showDetail));
  if(showList&&showDetail)parts.push('<div class="split" data-split="list" role="separator" aria-label="拖拽调整时间线和详情的宽度，双击恢复默认" title="拖拽调整宽度，双击恢复默认"></div>');
  if(showDetail)parts.push(detailCol());
  if(!showList&&!showDetail)parts.push('<div class="col desk" style="flex:1"><div class="empty">时间线和详情都已隐藏。用上方按钮重新显示。</div></div>');
  $('cols').innerHTML=parts.join('');sync();
  const ta=$('ta');if(ta)ta.focus();
  const rn=$('rn');if(rn){rn.focus();rn.select()}
  const at=$('add-title');if(at&&document.activeElement!==at&&!rn&&!$('ta')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT')at.focus();
}
function sync(){
  const single=S.mode==='single';
  $('tg-filter').classList.toggle('on',single?S.pane==='filter':S.show.filter&&S.mode==='wide');
  $('tg-list').classList.toggle('on',single?S.pane==='list':S.show.list);
  $('tg-detail').classList.toggle('on',single?S.pane==='detail':S.show.detail);
  $('mode').textContent={wide:'当前布局：三栏',mid:'当前布局：筛选栏自动收起',single:'当前布局：单栏，用右上角按钮切换'}[S.mode];
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function copy(text){try{navigator.clipboard.writeText(text).then(()=>toast('已复制'),()=>toast('复制被浏览器拒绝，请手动选中文字'))}catch(e){toast('复制被浏览器拒绝，请手动选中文字')}}
function wv(ek){const[key,v]=ek.split('#'),[cid,i]=key.split(':');return{key,w:card(cid).writings[+i],vi:+v}}
function menuHtml(){const m=S.menu;if(!m)return '';
  if(m.card)return `<button data-cm="rename">重命名</button><button data-cm="dup">复制为新经历</button><button data-cm="del" class="${m.confirm?'danger':''}">${m.confirm?'再点一次确认删除':'删除'}</button>`;
  const{w}=wv(m.ek);
  return `<button data-m="rename">重命名</button><button data-m="dup">复制为新版本</button><button data-m="del" ${w.versions.length<2?'disabled title="至少保留一个版本"':''} class="${m.confirm?'danger':''}">${m.confirm?'再点一次确认删除':'删除'}</button>`}
function showMenu(){const el=$('menu'),m=S.menu;if(!m){el.hidden=true;return}
  el.innerHTML=menuHtml();el.hidden=false;const W=el.offsetWidth,H=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(innerWidth-W-8,m.x))+'px';el.style.top=Math.max(8,Math.min(innerHeight-H-8,m.y))+'px';
  if(!m.confirm)el.querySelector('button').focus()}
function commitRename(inp){if(!S.rename)return;const n=inp.value.trim();if(S.rename.startsWith('card#')){const c=card(S.rename.slice(5));if(n&&c)c.title=n}else{const{w,vi}=wv(S.rename);if(n)w.versions[vi].name=n}S.rename=null}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(S.menu&&!(b&&(b.dataset.m||b.dataset.cm||b.dataset.menu||b.dataset.cmenu))){S.menu=null;showMenu()}
  if(!b)return;const d=b.dataset,single=S.mode==='single';
  if(d.menu){const r=b.getBoundingClientRect();S.menu=S.menu&&S.menu.ek===d.menu?null:{ek:d.menu,x:r.left,y:r.bottom+4};showMenu();return}
  if(d.cmenu){const r=b.getBoundingClientRect();S.menu=S.menu&&S.menu.card===d.cmenu?null:{card:d.cmenu,x:r.left,y:r.bottom+4};showMenu();return}
  if(d.cm){const m=S.menu,c=card(m.card),i=CARDS.indexOf(c);
    if(d.cm==='del'&&!m.confirm){m.confirm=true;showMenu();return}
    if(d.cm==='rename'){S.rename='card#'+c.id;S.show.list=true;if(S.mode==='single')S.pane='list'}
    else if(d.cm==='dup'){const n=JSON.parse(JSON.stringify(c));n.id='c'+Date.now();n.title=c.title+' 副本';CARDS.splice(i+1,0,n);S.sel=n.id;S.doc=null;toast('已复制为新经历')}
    else if(d.cm==='del'){CARDS.splice(i,1);DOCS.forEach(x=>x.paras.forEach(p=>{if(p.card===c.id)p.card=null}));if(S.sel===c.id){const v=visible()[0]||CARDS[0];S.sel=v?v.id:null}toast('已删除这段经历')}
    S.menu=null;showMenu();render();return}
  if(d.m){const m=S.menu,{key,w,vi}=wv(m.ek);
    if(d.m==='del'&&!m.confirm){m.confirm=true;showMenu();return}
    if(d.m==='rename'){S.rename=m.ek;S.edit=null}
    else if(d.m==='dup'){w.versions.splice(vi+1,0,{name:w.versions[vi].name+' 副本',text:w.versions[vi].text});S.ver[key]=vi+1;toast('已复制为新版本')}
    else if(d.m==='del'){w.versions.splice(vi,1);S.ver[key]=Math.max(0,Math.min(S.ver[key]||0,w.versions.length-1));S.edit=null;toast('已删除这个版本')}
    S.menu=null;showMenu();render();return}
  if(d.ratio){$('app').style.width=d.ratio+'%';document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.toggle('on',x===b));return}
  if(d.toggle){
    if(single)S.pane=d.toggle;
    else if(d.toggle==='filter'&&S.mode==='mid'){S.mode='wide';S.show.filter=true;S.pin=true}
    else{S.show[d.toggle]=!S.show[d.toggle];
      if(d.toggle==='list'&&!S.show.list){S.show.filter=true;if(S.mode==='mid'){S.mode='wide';S.pin=true}if(S.type)S.open[S.type]=true;else TYPES.forEach(t=>S.open[t]=true)}}}
  else if(d.pane)S.pane=d.pane;
  else if(d.open)S.open[d.open]=!S.open[d.open];
  else if(d.type){S.type=S.type===d.type?null:d.type;if(single)S.pane='list'}
  else if(d.tag){S.tag=S.tag===d.tag?null:d.tag;if(single)S.pane='list'}
  else if(d.alltypes){S.type=null;if(single)S.pane='list'}
  else if(d.add){S.adding=!S.adding}
  else if(d.addcancel){S.adding=false}
  else if(d.sel){S.sel=d.sel;S.doc=null;S.edit=null;S.show.detail=true;S.pane='detail'}
  else if(d.doc){S.doc=d.doc;S.hit=d.hit!==undefined?+d.hit:null;S.show.detail=true;S.pane='detail'}
  else if(d.back){S.doc=null}
  else if(d.ver){S.ver[d.ver]=+d.vi;S.edit=null}
  else if(d.exp){S.exp[d.exp]=!(S.expAll||S.exp[d.exp]);if(S.expAll){S.expAll=false;card(S.sel).writings.forEach((w,i)=>S.exp[S.sel+':'+i]=true);S.exp[S.sel+':ref']=true;S.exp[d.exp]=false}}
  else if(d.expall){S.expAll=!S.expAll;if(!S.expAll)S.exp={}}
  else if(d.edit)S.edit=d.edit;
  else if(d.cancel)S.edit=null;
  else if(d.save){const{w,vi}=wv(d.save);w.versions[vi].text=$('ta').value;S.edit=null;toast('已保存到当前版本')}
  else if(d.savenew){const{key,w}=wv(d.savenew);w.versions.push({name:'v'+(w.versions.length+1)+' 新版本',text:$('ta').value});S.ver[key]=w.versions.length-1;S.edit=null;toast('已另存为新版本')}
  else if(d.copy){const{w,vi}=wv(d.copy);copy(w.versions[vi].text);return}
  else if(d.copytext){copy(d.copytext);return}
  else return;
  render();
});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-vk],[data-ck]');if(!t)return;e.preventDefault();
  S.menu=t.dataset.vk?{ek:t.dataset.vk,x:e.clientX,y:e.clientY}:{card:t.dataset.ck,x:e.clientX,y:e.clientY};showMenu()});
document.addEventListener('submit',e=>{if(e.target.id!=='addf')return;e.preventDefault();const title=$('add-title').value.trim();if(!title)return;
  const time=$('add-time').value.trim()||'2026.11',y=parseInt(time,10);
  const c={id:'c'+Date.now(),type:$('add-type').value,org:title.split(/[·・]/)[0].trim(),title,time,year:y>1900?y:2026,role:'',tags:[],fact:'',result:'',thought:'',works:[],writings:[]};
  CARDS.push(c);S.sel=c.id;S.doc=null;S.adding=false;if(S.type&&S.type!==c.type)S.type=null;S.tag=null;toast('已新增一段经历');render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.menu){S.menu=null;showMenu()}if(S.rename){S.rename=null;render()}}
  if(e.key==='Enter'&&e.target.id==='rn'){commitRename(e.target);render()}});
document.addEventListener('focusout',e=>{if(e.target.id==='rn'&&S.rename){commitRename(e.target);render()}});
$('q').addEventListener('input',e=>{S.q=e.target.value;if(S.mode==='single')S.pane='list';render()});
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.split');if(!s)return;drag={k:s.dataset.split,x:e.clientX,f:S.f[s.dataset.split],el:s,W:$('cols').clientWidth};s.classList.add('drag');s.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const other=drag.k==='filter'?(S.show.list?S.f.list:0):(S.show.filter&&S.mode==='wide'?S.f.filter:0);
  const min=(drag.k==='filter'?150:200)/drag.W,max=1-other-240/drag.W;
  S.f[drag.k]=Math.max(min,Math.min(max,drag.f+(e.clientX-drag.x)/drag.W));
  const col=drag.el.previousElementSibling;if(col)col.style.flexBasis=pct(drag.k)});
document.addEventListener('pointerup',()=>{if(drag){drag.el.classList.remove('drag');drag=null}});
document.addEventListener('dblclick',e=>{const s=e.target.closest('.split');if(s){S.f[s.dataset.split]=DEF[s.dataset.split];render()}});
new ResizeObserver(([en])=>{const w=en.contentRect.width,m=w<520?'single':w<820?'mid':'wide';
  if(m==='wide')S.pin=false;
  if(S.pin&&m==='mid')return;
  if(m!==S.mode){S.mode=m;if(m==='single')S.pane=S.doc||S.sel?'detail':'list';render()}}).observe($('cols'));
render();
</script>
</body>
</html>
