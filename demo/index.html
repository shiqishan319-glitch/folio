<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经历库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: three proportional columns (filter / timeline / detail) with draggable dividers; collapses to rail, then to one pane, as the page narrows */
  /* style: 精致 Bento — v1 精致产品感 craft and layout with Bento tiles, in the Bento 卡片墙 (v8) palette */
  /* palette: Bento 卡片墙 (v8) — blue→violet accent, soft multi-glow canvas, per-type colours */
  --bg:#eceef4; --glow:rgba(99,118,255,.20); --glow-b:rgba(255,148,96,.16); --glow-c:rgba(32,190,140,.10);
  --tile-top:#ffffff; --tile-bot:#fbfbfe; --tile-bd:rgba(17,22,40,.06); --tile-hl:inset 0 1px 0 rgba(255,255,255,.9);
  --sh-tile:0 1px 1px rgba(16,24,40,.03),0 2px 6px -2px rgba(16,24,40,.06),0 12px 28px -12px rgba(16,24,40,.14);
  --sh-hi:0 2px 4px rgba(16,24,40,.05),0 22px 44px -16px rgba(16,24,40,.26);
  --g1:#4a5cff; --g2:#9b5cff; --hi-bg:#121521; --hi-ink:#f1f3f9; --hi-muted:rgba(241,243,249,.62); --tint:20%;
  --panel:#ffffff; --raised:#ffffff; --sunk:#f2f3f8; --canvas:#f7f8fb; --tile:#ffffff; --r:16px; --r-sm:13px; --track:#f2f3f8;
  --hover:rgba(17,22,40,.045); --press:rgba(17,22,40,.08);
  --line:#e2e5ee; --line-2:#d3d7e2;
  --ink:#10131b; --ink-2:#343a4a; --muted:#5f6779; --faint:#9aa0ae;
  --accent:#4354ff; --accent-solid:#4a5cff; --accent-solid-2:#9b5cff; --on-accent:#ffffff;
  --accent-soft:#eceeff; --accent-line:rgba(67,84,255,.28); --ring:rgba(67,84,255,.5);
  --warn:#9a5b00; --warn-soft:#fdf1dc; --danger:#d23a2c; --danger-soft:#fdecea;
  --toast:#171b25; --toast-ink:#eceef4;
  --hl:inset 0 1px 0 rgba(255,255,255,.9);
  --topbar:linear-gradient(180deg,#ffffff 0%,#fbfbfe 100%);
  --shadow-xs:0 1px 1px rgba(16,24,40,.04);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 1px rgba(16,24,40,.03);
  --shadow:0 1px 1px rgba(16,24,40,.03),0 2px 6px -2px rgba(16,24,40,.06),0 12px 28px -12px rgba(16,24,40,.14);
  --shadow-lg:0 2px 4px rgba(16,24,40,.05),0 22px 44px -16px rgba(16,24,40,.26);
  --t1:#4f6bff; --t2:#f26b1d; --t3:#0f9f6e; --t4:#d99a00; --t5:#b14fe0;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --display:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07080c; --glow:rgba(92,108,255,.20); --glow-b:rgba(190,92,255,.12); --glow-c:rgba(30,200,150,.07);
    --tile-top:#191c26; --tile-bot:#12141b; --tile-bd:rgba(255,255,255,.07); --tile-hl:inset 0 1px 0 rgba(255,255,255,.06);
    --sh-tile:0 1px 0 rgba(255,255,255,.02),0 14px 34px -14px rgba(0,0,0,.8);
    --sh-hi:0 26px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06);
    --g1:#4b55f0; --g2:#8e44e8; --hi-bg:#1b1f2c; --hi-ink:#f4f5fa; --hi-muted:rgba(244,245,250,.6); --tint:30%;
    --panel:#14161e; --raised:#232736; --sunk:#1c1f2a; --canvas:#0e1016; --tile:#14161e; --track:#1c1f2a;
    --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
    --line:#2a2e3b; --line-2:#363b4a;
    --ink:#eef0f6; --ink-2:#c9cdd8; --muted:#9aa1b2; --faint:#646b7c;
    --accent:#8f9bff; --accent-solid:#4b55f0; --accent-solid-2:#8e44e8; --on-accent:#ffffff;
    --accent-soft:rgba(143,155,255,.15); --accent-line:rgba(143,155,255,.34); --ring:rgba(143,155,255,.6);
    --warn:#e7b25a; --warn-soft:#3a2c12; --danger:#ff7b7b; --danger-soft:rgba(255,110,110,.12);
    --toast:#e2e5ee; --toast-ink:#07080c;
    --hl:inset 0 1px 0 rgba(255,255,255,.06);
    --topbar:linear-gradient(180deg,#191c26 0%,#12141b 100%);
    --shadow-xs:0 1px 1px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
    --shadow:0 1px 0 rgba(255,255,255,.02),0 14px 34px -14px rgba(0,0,0,.8);
    --shadow-lg:0 26px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06);
    --t1:#8197ff; --t2:#ff9a5c; --t3:#3fd3a0; --t4:#ffc84a; --t5:#d88cff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07080c; --glow:rgba(92,108,255,.20); --glow-b:rgba(190,92,255,.12); --glow-c:rgba(30,200,150,.07);
    --tile-top:#191c26; --tile-bot:#12141b; --tile-bd:rgba(255,255,255,.07); --tile-hl:inset 0 1px 0 rgba(255,255,255,.06);
    --sh-tile:0 1px 0 rgba(255,255,255,.02),0 14px 34px -14px rgba(0,0,0,.8);
    --sh-hi:0 26px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06);
    --g1:#4b55f0; --g2:#8e44e8; --hi-bg:#1b1f2c; --hi-ink:#f4f5fa; --hi-muted:rgba(244,245,250,.6); --tint:30%;
    --panel:#14161e; --raised:#232736; --sunk:#1c1f2a; --canvas:#0e1016; --tile:#14161e; --track:#1c1f2a;
    --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
    --line:#2a2e3b; --line-2:#363b4a;
    --ink:#eef0f6; --ink-2:#c9cdd8; --muted:#9aa1b2; --faint:#646b7c;
    --accent:#8f9bff; --accent-solid:#4b55f0; --accent-solid-2:#8e44e8; --on-accent:#ffffff;
    --accent-soft:rgba(143,155,255,.15); --accent-line:rgba(143,155,255,.34); --ring:rgba(143,155,255,.6);
    --warn:#e7b25a; --warn-soft:#3a2c12; --danger:#ff7b7b; --danger-soft:rgba(255,110,110,.12);
    --toast:#e2e5ee; --toast-ink:#07080c;
    --hl:inset 0 1px 0 rgba(255,255,255,.06);
    --topbar:linear-gradient(180deg,#191c26 0%,#12141b 100%);
    --shadow-xs:0 1px 1px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);
    --shadow:0 1px 0 rgba(255,255,255,.02),0 14px 34px -14px rgba(0,0,0,.8);
    --shadow-lg:0 26px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06);
    --t1:#8197ff; --t2:#ff9a5c; --t3:#3fd3a0; --t4:#ffc84a; --t5:#d88cff;
    color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1100px 460px at 50% -240px,var(--glow),transparent 72%) no-repeat,var(--bg);color:var(--ink);font:14px/1.6 var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility}
::selection{background:var(--accent-soft);color:var(--ink)}
.ic{display:inline-block;flex:none;vertical-align:-2px}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:4px 10px;cursor:pointer;transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease)}
button:hover{background:var(--hover)}
button:active{background:var(--press)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
button.on{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;border-color:var(--line-2);background:var(--panel);color:var(--ink-2);font-size:12.5px;font-weight:500;line-height:18px;padding:4px 11px;box-shadow:var(--shadow-xs),var(--hl)}
.btn:hover{background:var(--sunk);border-color:var(--line-2);color:var(--ink)}
.btn:active{transform:translateY(.5px) scale(.985);background:var(--hover)}
.btn.pri{background:linear-gradient(135deg,var(--accent-solid),var(--accent-solid-2));border-color:transparent;color:var(--on-accent);box-shadow:0 1px 2px rgba(74,92,255,.3),0 0 0 1px var(--accent-solid),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.pri:hover{color:var(--on-accent);filter:brightness(1.06)}

/* ---------- demo harness (quiet) ---------- */
.sim{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 20px;font-size:11.5px;color:var(--faint)}
.sim b{color:var(--muted);font-weight:600}
.sim .seg{padding:1px;border-radius:7px}
.sim .seg button{padding:0 9px;font-size:11.5px;line-height:20px;border-radius:6px}
#mode{font-variant-numeric:tabular-nums}

/* segmented controls */
.seg{display:inline-flex;background:var(--track);border:1px solid transparent;border-radius:9px;padding:2px;gap:2px}
.seg button{padding:3px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);line-height:20px}
.seg button:hover{background:transparent;color:var(--ink)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- shell ---------- */
.stage{flex:1;min-height:0;display:flex;padding:0 20px 20px}
.app{display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;transition:width .38s var(--ease)}
.top{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--topbar)}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;padding-right:4px}
.brand .logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#8a86ff 0%,var(--accent-solid) 55%,#3f39c4 100%);box-shadow:0 1px 2px rgba(74,92,255,.35),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(0,0,0,.08)}
.search{flex:1;min-width:120px;position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:10px;top:50%;margin-top:-7px;color:var(--faint);pointer-events:none;transition:color .16s var(--ease)}
.search input{width:100%;font:inherit;font-size:13px;color:inherit;background:var(--track);border:1px solid transparent;border-radius:9px;padding:5px 12px 5px 32px;line-height:20px;transition:background-color .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
.search input::placeholder{color:var(--faint)}
.search input:hover{background:var(--press)}
.search input:focus{outline:none;border-color:var(--accent-line);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.search:focus-within .ic{color:var(--accent)}
.cols{flex:1;min-height:0;display:flex}
.col{min-width:0;overflow:auto;padding:18px 18px 28px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.col::-webkit-scrollbar{width:10px;height:10px}
.col::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.col.side{background:var(--sunk)}
.col h2{font-size:12px;margin:0 0 12px;font-weight:600;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:28px}
.col h2 button{white-space:nowrap;flex:none;font-weight:500;letter-spacing:0;color:var(--ink-2)}
.col h2 > button:not(.btn){width:26px;height:26px;padding:0;display:grid;place-items:center;color:var(--faint)}
.col h2 > button:not(.btn):hover{color:var(--ink)}
.col h2 .btn{padding:3px 10px 3px 8px}

/* resize handles */
.split{flex:0 0 9px;margin:0 -4px;z-index:2;cursor:col-resize;position:relative;touch-action:none}
.split::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line);transition:background-color .16s var(--ease)}
.split::after{content:"";position:absolute;left:2.5px;top:50%;width:4px;height:28px;margin-top:-14px;border-radius:4px;background:var(--line-2);opacity:0;transition:opacity .16s var(--ease),background-color .16s var(--ease),height .22s var(--ease),margin-top .22s var(--ease)}
.split:hover::after,.split.drag::after{opacity:1;background:var(--accent);height:52px;margin-top:-26px;box-shadow:0 0 0 3px var(--accent-soft)}
.split:hover::before,.split.drag::before{background:var(--accent-line)}
.rail{flex:0 0 48px;background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.rail button{width:32px;height:32px;padding:0;display:grid;place-items:center;color:var(--muted)}
.rail button:hover{color:var(--ink)}
.rail .n{font-size:11px;color:var(--accent);writing-mode:vertical-rl;letter-spacing:.12em;background:var(--accent-soft);border-radius:999px;padding:8px 2px;font-weight:500}

/* ---------- filter column ---------- */
.lab{font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 8px;letter-spacing:.04em;padding-top:16px;border-top:1px solid var(--line)}
.tree{list-style:none;margin:0;padding:0}
.trow{display:flex;align-items:center;gap:0;border-radius:8px;transition:background-color .16s var(--ease)}
.trow:hover{background:var(--hover)}
.trow:has(.name.on){background:var(--accent-soft)}
.trow .name{flex:1;text-align:left;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.trow .name:hover,.trow .name.on,.trow .name:active{background:transparent}
.trow .name.on{color:var(--accent)}
.trow .name[data-type]::before{content:"";flex:none;width:7px;height:7px;border-radius:2.5px;background:var(--c,var(--faint));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--faint)) 16%,transparent)}
.name[data-type="实习"]{--c:var(--t1)} .name[data-type="项目"]{--c:var(--t2)} .name[data-type="志愿者"]{--c:var(--t3)} .name[data-type="获奖"]{--c:var(--t4)} .name[data-type="思考"]{--c:var(--t5)}
.trow .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;padding:0 8px;min-width:26px;text-align:right;font-weight:500}
.trow:has(.name.on) .cnt{color:var(--accent)}
.caret{padding:0;width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--faint);border-radius:6px;margin-left:2px}
.caret:hover{color:var(--ink)}
.caret .ic{transition:transform .2s var(--ease)}
.caret[aria-expanded="true"] .ic{transform:rotate(90deg)}
.sub{list-style:none;margin:2px 0 8px 13px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.sub button{display:block;width:100%;text-align:left;padding:4px 8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:7px;position:relative}
.sub button:hover{color:var(--ink)}
.sub button.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.tree .sub button.on::before{content:"";position:absolute;left:-11px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.sub button .ic{margin-right:7px;color:var(--faint)}
.sub button.on .ic{color:var(--accent)}
.allt{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;border-radius:999px;border-color:var(--line);background:var(--panel);padding:2px 10px 2px 9px;color:var(--ink-2);line-height:18px;box-shadow:var(--shadow-xs)}
.chips button::before{content:"#";color:var(--faint);margin-right:3px;font-weight:500}
.chips button:hover{border-color:var(--line-2);background:var(--sunk);color:var(--ink)}
.chips button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);box-shadow:none}
.chips button.on::before{color:var(--accent)}
.tagbar{margin:0 0 16px}
.add{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent-line);border-radius:12px;padding:12px;margin-bottom:16px;background:var(--panel);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-sm);animation:pop .26s var(--spring) both}
.add input,.add select{font:inherit;font-size:13px;color:inherit;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;min-width:0;line-height:20px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.add input:focus,.add select:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.add .hint{font-size:11.5px;color:var(--muted)}
.card[data-ck],.sub [data-ck]{cursor:pointer}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:linear-gradient(180deg,var(--line-2),var(--line) 85%,transparent)}
.yr{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--ink-2);margin:20px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:.03em;position:relative;display:flex;align-items:center;gap:10px;line-height:20px}
.yr:first-child{margin-top:2px}
.yr::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--faint);box-shadow:0 0 0 3px var(--panel)}
.yr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:11px;padding:10px 12px 11px;margin-bottom:4px;position:relative;transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease)}
.card::before{content:"";position:absolute;left:-20px;top:18px;width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--line-2) 55%,var(--faint));box-shadow:0 0 0 3px var(--panel);transition:background-color .18s var(--ease),box-shadow .2s var(--ease)}
.card:hover{background:var(--hover)}
.card:active{transform:scale(.995)}
.card.on{background:var(--raised);border-color:var(--line);box-shadow:var(--shadow);color:inherit}
.card.on.fx{animation:lift .32s var(--ease) both}
.card .t{font-weight:600;overflow-wrap:anywhere;font-size:14px;letter-spacing:-.003em;line-height:1.5}
.card .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.card .ps{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.card .rn{border-radius:8px!important}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel);font-weight:500}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.solid{background:var(--track);border-color:transparent;color:var(--ink-2)}
.pill .ic{color:var(--faint)}
.card.on .pill.solid{background:var(--accent-soft);color:var(--accent)}
.card.on .pill.solid .ic{color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:22px 16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;background:var(--sunk)}

/* ---------- detail ---------- */
.dt{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.35;margin:2px 0 6px;letter-spacing:-.012em;text-wrap:balance;overflow-wrap:anywhere}
.dt .more{color:var(--faint)}
.dm{color:var(--muted);font-size:12.5px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:minmax(40px,max-content) 1fr;gap:0 22px;max-width:68ch;border:1px solid var(--line);border-radius:12px;padding:2px 16px;background:var(--panel);box-shadow:var(--shadow-xs)}
.fields > .k,.fields > .v{padding:11px 0;border-bottom:1px solid var(--line)}
.fields > :nth-last-child(-n+2){border-bottom:none}
.fields .k{font-size:12px;color:var(--muted);letter-spacing:.04em;padding-top:13px;font-weight:500}
.fields .v{overflow-wrap:anywhere;min-width:0;color:var(--ink)}
.fields .v.miss{color:var(--faint);font-size:13px}
.fields .v.miss::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);opacity:.7;margin-right:8px;vertical-align:2px}
.fields .v .pill{margin:0 4px 4px 0}
.sec{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:28px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
.w{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--panel);max-width:72ch;box-shadow:var(--shadow-sm);transition:border-color .18s var(--ease),box-shadow .22s var(--ease)}
.w:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.w .hd{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:11px 12px 0 14px}
.w .hd .ty{font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.w .hd .ty::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent)}
.w.ref .hd .ty::before{background:var(--faint)}
.vers{display:inline-flex;flex-wrap:wrap;gap:2px;flex:0 1 auto;min-width:0;align-items:center;background:var(--track);border-radius:9px;padding:2px}
.vers:empty{display:none}
.vers button[role=tab]{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vers button{font-size:12px;padding:1px 10px;border-radius:7px;color:var(--muted);line-height:20px;font-weight:500}
.vers button:hover{background:transparent;color:var(--ink)}
.vers button.on{color:var(--ink);background:var(--raised);box-shadow:var(--shadow-sm)}
.vers .more{padding:0 6px;margin-left:-2px}
.w .bd{padding:10px 14px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;color:var(--ink)}
.w textarea{width:100%;min-height:120px;font:inherit;line-height:1.8;color:inherit;background:var(--sunk);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;resize:vertical;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background-color .16s var(--ease)}
.w textarea:focus{outline:none;border-color:var(--accent-line);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.w .acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 13px}
.w .acts button{font-size:12px}
.w .acts > button:not(.btn){color:var(--muted)}
.w.wide{max-width:none}
.vbody.fx{animation:swap .26s var(--ease) both}
.tog{font-size:12px;color:var(--accent);padding:2px 10px;white-space:nowrap;border-radius:999px;font-weight:500;margin-left:auto}
.tog:hover{background:var(--accent-soft)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec .tog{letter-spacing:0;font-weight:500;border:1px solid var(--accent-line);padding:2px 11px}
.more{padding:0 6px;color:var(--faint);font-size:14px;line-height:20px;border-radius:6px;letter-spacing:.5px}
.more:hover{color:var(--ink)}
.rn{font:inherit;font-size:12px;color:inherit;background:var(--panel);border:1px solid var(--accent);border-radius:7px;padding:1px 9px;width:11em;max-width:100%;line-height:20px;box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:11px;border-radius:0 0 11px 11px;overflow:hidden}
.cmp.fx .cell{animation:rise .34s var(--ease) both}
.cmp.fx .cell:nth-child(2){animation-delay:.04s}
.cmp.fx .cell:nth-child(3){animation-delay:.08s}
.cmp.fx .cell:nth-child(n+4){animation-delay:.12s}
.cmp .cell{background:var(--panel);display:flex;flex-direction:column;min-width:0}
.w.ref .cmp .cell{background:var(--sunk)}
.cmp .ch{display:flex;align-items:center;gap:2px;padding:10px 14px 0;font-size:12px;color:var(--accent);font-weight:600;min-width:0}
.cmp .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:context-menu;background:var(--accent-soft);border-radius:6px;padding:0 8px;line-height:20px}
.cmp .bd{flex:1}
.vers [data-vk]{cursor:context-menu}
.menu{position:fixed;z-index:10;background:var(--raised);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow-lg);padding:4px;display:flex;flex-direction:column;min-width:168px;transform-origin:top left;animation:menu .16s var(--ease) both}
.menu[hidden]{display:none}
.menu button{text-align:left;font-size:13px;padding:6px 10px;border-radius:7px;color:var(--ink-2)}
.menu button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.menu button:disabled{color:var(--muted);cursor:not-allowed;opacity:.55}
.menu [data-m="del"],.menu [data-cm="del"]{margin-top:5px;position:relative}
.menu [data-m="del"]::before,.menu [data-cm="del"]::before{content:"";position:absolute;left:-4px;right:-4px;top:-3px;height:1px;background:var(--line)}
.menu [data-m="del"]:hover:not(:disabled),.menu [data-cm="del"]:hover{color:var(--danger);background:var(--danger-soft)}
.menu button.danger,.menu button.danger:hover{color:var(--danger);background:var(--danger-soft);font-weight:600}
.w.ref{background:var(--sunk);border-style:dashed;box-shadow:none}
.w.ref:hover{box-shadow:none}

/* application record */
.doc .body{max-width:66ch}
.doc p{margin:0 0 6px;padding:10px 16px;border-left:2px solid transparent;border-radius:0 10px 10px 0;line-height:1.9;transition:background-color .2s var(--ease)}
.doc p.hit{border-left-color:var(--accent);background:var(--accent-soft)}
.detail.fx .doc p.hit,.doc.fx p.hit{animation:flash 1.1s var(--ease) both}
.doc .from{margin:-2px 0 14px 16px}
.doc .from button{font-size:11.5px;border-radius:999px;padding:0 10px 0 8px;color:var(--muted);border-color:var(--line);background:var(--panel);line-height:20px;display:inline-flex;align-items:center;gap:5px}
.doc .from button::before{content:"↳";color:var(--faint)}
.doc .from button:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.doc .from button:hover::before{color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px) scale(.97);background:var(--toast);color:var(--toast-ink);padding:8px 16px 8px 14px;border-radius:999px;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .32s var(--spring);box-shadow:var(--shadow-lg),inset 0 0 0 1px rgba(255,255,255,.06);display:flex;align-items:center;gap:8px}
.toast::before{content:"";width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 0 3px var(--accent-soft)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- Bento layer: floating tiles on a tinted canvas (v1 craft, v8 composition) ---------- */
.tc0{--tc:var(--t1)}.tc1{--tc:var(--t2)}.tc2{--tc:var(--t3)}.tc3{--tc:var(--t4)}.tc4{--tc:var(--t5)}.tc5{--tc:#0891b2}
body{background:
  radial-gradient(900px 560px at 6% -12%,var(--glow),transparent 62%),
  radial-gradient(760px 560px at 104% 6%,var(--glow-b),transparent 62%),
  radial-gradient(700px 480px at 50% 118%,var(--glow-c),transparent 62%),var(--bg);background-attachment:fixed}
/* shared floating-tile surface */
.top,.col.side,.rail,.stats,.card,.hero,.tile,.w,.doc .body{background:linear-gradient(180deg,var(--tile-top),var(--tile-bot));border:1px solid var(--tile-bd);box-shadow:var(--sh-tile),var(--tile-hl)}
.num,.st .sn,.cnum b,.yr b,.kpi b,.big span,.trow .cnt,.lg b{font-variant-numeric:tabular-nums}

/* shell: the app frame dissolves, panels float */
.stage{padding:14px 18px 18px}
.app{background:transparent;border:none;box-shadow:none;border-radius:0;overflow:visible;gap:12px;width:100%;transition:none}
.top{border-radius:20px;padding:9px 10px 9px 12px}
.brand .logo{border-radius:8px;background:linear-gradient(140deg,var(--g1),var(--g2))}
.search input{border-radius:999px;padding-left:34px}
.search .ic{left:13px}
.seg{border-radius:12px;padding:3px}
.seg button{border-radius:9px}
.cols{gap:0}
.col{container-type:inline-size;padding:4px 10px 28px}
.col:not(.side){background:transparent}
.col.side{border-radius:22px;padding:14px 10px 18px}
.col.side h2{margin:0 4px 10px}
.split{flex:0 0 12px;margin:0}
.split::before{display:none}
.split::after{left:4px;opacity:.55;background:var(--line-2)}
.rail{flex:0 0 50px;border-radius:20px;margin-right:10px}
.col h2{color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.02em;margin:2px 4px 12px}
.col h2 .hcnt{font-weight:500;color:var(--muted);font-size:12px}
.btn{border-radius:10px}
.lab{border-top:none;padding-top:0;margin:22px 6px 8px;color:var(--muted)}

/* left nav inside its tile */
.trow{border-radius:12px}
.trow .name{padding:6px 10px;border-radius:12px}
.tree li .trow:has(.name.on){background:color-mix(in srgb,var(--tc,var(--accent)) 13%,transparent)}
.tree li .trow:has(.name.on) .name{color:var(--ink)}
.tree li .trow:has(.name.on) .cnt{color:color-mix(in srgb,var(--tc) 75%,var(--ink));background:color-mix(in srgb,var(--tc) 14%,transparent)}
.trow .cnt{min-width:24px;padding:0 7px;margin-right:6px;border-radius:999px;background:var(--track);color:var(--muted);font-weight:600;text-align:center;line-height:18px}
.trow .name[data-type]::before{width:9px;height:9px;border-radius:3px}
.sub{margin-left:20px;border-left:2px solid color-mix(in srgb,var(--tc,var(--line)) 24%,transparent)}
.tree .sub button.on::before{left:-12px;background:var(--tc,var(--accent))}
.tree .sub button.on{color:var(--ink);background:var(--track)}
.lab + .sub button{display:flex;align-items:center;gap:8px;white-space:normal;line-height:1.4;padding:7px 10px;margin-bottom:4px;border-radius:12px;background:var(--track);color:var(--ink-2);font-size:12.5px}
.lab + .sub button .ic{margin:0;width:22px;height:22px;padding:4px;border-radius:7px;background:linear-gradient(140deg,var(--g1),var(--g2));color:#fff}
.lab + .sub button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lab + .sub button.on .ic{color:#fff}

/* chips + misc */
.chips button{border-color:var(--tile-bd);background:var(--tile-top);padding:3px 11px 3px 10px}
.tagbar{margin:0 4px 16px}
.add{border-radius:20px}
.empty{border-radius:20px;background:transparent}
.menu{border-radius:14px;padding:5px;background:color-mix(in srgb,var(--tile-top) 90%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-color:var(--tile-bd);box-shadow:var(--sh-hi)}
.menu button{border-radius:9px;padding:7px 11px}

/* ---------- overview: one compact band ---------- */
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 16px;padding:9px 14px 10px;border-radius:18px}
.sts{display:flex;align-items:center;gap:0;min-width:0;flex:0 1 auto}
.st{display:flex;align-items:baseline;gap:5px;min-width:0;padding:0 12px;white-space:nowrap}
.st:first-child{padding-left:0}
.st + .st{border-left:1px solid var(--line)}
.st .sn{font-size:22px;font-weight:700;line-height:24px;letter-spacing:-.045em;color:var(--ink)}
.st .sk{font-size:12px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.st .wo{color:var(--faint)}
.st-main .sn{display:inline-block;min-width:28px;padding:0 7px;border-radius:8px;text-align:center;color:#fff;background:linear-gradient(140deg,var(--g1),var(--g2));box-shadow:0 4px 10px -6px var(--g2),inset 0 1px 0 rgba(255,255,255,.22);align-self:center}
.st-mix{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;flex:1 1 100%;min-width:0}
.bar{display:flex;gap:2px;flex:1 1 60px;min-width:60px;height:6px}
.bar i{display:block;min-width:6px;border-radius:999px;background:var(--tc)}
.lg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;line-height:15px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lg span.zero{opacity:.45}
.lg i{width:6px;height:6px;border-radius:2px;background:var(--tc)}
.lg b{font-weight:600;color:var(--ink-2)}
/* wide timeline column: everything in a single row */
@container (min-width:640px){.stats{flex-wrap:nowrap;gap:18px;padding:9px 16px}.st-mix{flex:1 1 auto;flex-wrap:nowrap}.lg{flex-wrap:nowrap}}
/* narrow column (half-screen in a coding tool): one strip — three stats + a 6px bar */
@container (max-width:380px){
  .stats{padding:8px 10px 9px;gap:7px 0;border-radius:16px;margin-bottom:14px}
  .sts{flex:1 1 100%;justify-content:space-between}
  /* sized so three two-digit counts still leave room for the full labels (「简历」, not 「简」) */
  .st{padding:0 5px;gap:2px}
  .st:last-child{padding-right:0}
  .st .sn{font-size:17px;line-height:22px;letter-spacing:-.05em}
  .st .sk{font-size:11px}
  .st .wo,.lg{display:none}
  .st-main .sn{min-width:22px;padding:0 4px;border-radius:7px}
  .bar{flex:1 1 100%}
}

/* ---------- timeline as a bento flow ---------- */
.tl{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:stretch;padding-left:0}
.tl::before,.yr::before,.card::before{display:none}
.tl > .yr{grid-column:1/-1}
.yr{display:flex;align-items:baseline;gap:10px;margin:14px 4px 0;line-height:1}
.yr:first-child{margin-top:2px}
.yr b{font-size:26px;font-weight:700;letter-spacing:-.045em;color:var(--ink)}
.yr .yc{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.yr::after{content:"";flex:1;height:1px;align-self:center;background:linear-gradient(90deg,var(--line-2),transparent)}
.card{display:flex;flex-direction:column;margin:0;border-radius:20px;padding:14px 16px 15px;overflow:hidden;color:inherit;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
.card > *{position:relative}
.card:hover{background:linear-gradient(180deg,var(--tile-top),var(--tile-bot));border-color:var(--tile-bd);transform:translateY(-3px) rotate(-.3deg);box-shadow:var(--sh-hi),var(--tile-hl)}
.card:active{transform:translateY(-1px) scale(.995)}
.card.on{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 8%,var(--tile-top)),var(--tile-bot));border-color:color-mix(in srgb,var(--tc) 48%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 15%,transparent),var(--sh-hi),var(--tile-hl)}
.card.on.fx{animation:lift .34s var(--ease) both}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;margin-bottom:8px;min-width:0}
.tbadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--tc,var(--accent)) 78%,var(--ink));background:color-mix(in srgb,var(--tc,var(--accent)) 12%,transparent);padding:1px 10px 1px 8px;border-radius:999px;white-space:nowrap;line-height:20px;letter-spacing:.02em}
.tbadge::before{content:"";flex:none;width:7px;height:7px;border-radius:2.5px;background:var(--tc,var(--accent))}
.cnum{display:inline-flex;align-items:baseline;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:500}
.cnum .ic{display:none}
.cnum b{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--ink)}
.card.on .cnum b{color:color-mix(in srgb,var(--tc) 80%,var(--ink))}
.card .t{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.005em}
.card .m{margin-top:3px}
.card .ps{margin-top:10px}
.card .pill{background:transparent}
@container (min-width:540px){.tl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:250px){.ctop{flex-wrap:wrap;row-gap:4px}.card{padding:12px 13px 13px}}

/* ---------- detail: hero + bento ---------- */
.backrow{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 12px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 22px 18px;background:
  radial-gradient(120% 150% at 100% 0%,color-mix(in srgb,var(--tc,var(--accent)) var(--tint),transparent),transparent 55%),
  linear-gradient(180deg,var(--tile-top),var(--tile-bot))}
.hero .ghost{position:absolute;right:16px;bottom:-26px;font-size:124px;font-weight:800;line-height:1;letter-spacing:-.06em;color:var(--tc,var(--accent));opacity:.065;pointer-events:none;user-select:none;font-variant-numeric:tabular-nums}
.hero > *:not(.ghost){position:relative}
.htop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
.htop .sep{display:none}
.hero .dt{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 10px}
.hero .dm{margin:0;gap:5px 6px}
.hero .dm:empty{display:none}
.hero .dm .pill{background:color-mix(in srgb,var(--tile-top) 70%,transparent)}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:0;border-top:none}
.kpi{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);padding:8px 14px 8px 12px;border-radius:14px;background:color-mix(in srgb,var(--tile-top) 86%,transparent);border:1px solid var(--tile-bd);white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.kpi b{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--ink)}
@container (max-width:440px){.hero{padding:16px 16px 15px;border-radius:22px}.hero .dt{font-size:22px}.hero .ghost{font-size:92px;bottom:-18px}.kpi{padding:6px 11px 6px 10px}.kpi b{font-size:18px}}

.bento{display:grid;gap:12px;margin-top:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"fact" "res" "th" "wk"}
@container (min-width:360px){.bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"fact fact" "res th" "wk wk"}}
@container (min-width:620px){.bento{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(200px,.95fr);grid-template-areas:"fact fact res" "th wk res"}}
.tile{position:relative;overflow:hidden;min-width:0;border-radius:22px;padding:15px 17px 16px;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-hi),var(--tile-hl);border-color:var(--tile-bd)}
.tile.fact{grid-area:fact}.tile.res{grid-area:res}.tile.th{grid-area:th}.tile.wk{grid-area:wk}
.lk{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:.04em}
.lk .ic{width:26px;height:26px;padding:6px;border-radius:9px;background:var(--track);color:var(--ink-2);flex:none}
.tile .v{font-size:14.5px;line-height:1.75;overflow-wrap:anywhere;color:var(--ink)}
.tile.miss{background:transparent;border:1.5px dashed var(--line-2);box-shadow:none}
.tile.miss:hover{transform:none;box-shadow:none;border-color:var(--faint)}
.tile.miss .v{color:var(--muted);font-size:13px}
.tile.miss .lk .ic{background:transparent;border:1px dashed var(--line-2);color:var(--faint)}
/* 结果: the feature tile — deep, tinted with the type colour, huge numeral */
.tile.res:not(.miss){display:flex;flex-direction:column;color:var(--hi-ink);border-color:rgba(255,255,255,.06);background:
  radial-gradient(130% 90% at 100% 0%,color-mix(in srgb,var(--tc,var(--accent)) 38%,transparent),transparent 60%),
  radial-gradient(90% 70% at 0% 100%,color-mix(in srgb,var(--g2) 26%,transparent),transparent 70%),var(--hi-bg);
  box-shadow:0 18px 36px -20px color-mix(in srgb,var(--hi-bg) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}
.tile.res:not(.miss) .lk{color:var(--hi-muted)}
.tile.res:not(.miss) .lk .ic{background:rgba(255,255,255,.1);color:var(--hi-ink)}
.big{display:flex;align-items:baseline;gap:4px;margin:6px 0 12px;flex-wrap:wrap}
.big span{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-.06em;background:linear-gradient(120deg,#fff 10%,color-mix(in srgb,var(--tc,var(--accent)) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.big small{font-size:18px;font-weight:700;color:color-mix(in srgb,var(--tc,var(--accent)) 50%,#fff)}
.tile.res:not(.miss) .v{margin-top:auto;font-size:13.5px;color:var(--hi-ink);opacity:.86}
@container (max-width:440px){.big span{font-size:50px}}
/* 思考: quote tile */

@container (min-width:620px){.bento{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(220px,1.15fr);grid-template-areas:"fact fact res" "th th wk"}
  .tile.res:not(.miss){display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"lk lk" "big v";align-items:center;column-gap:12px}
  .tile.res:not(.miss) .lk{grid-area:lk}.tile.res:not(.miss) .big{grid-area:big;margin:0}.tile.res:not(.miss) .v{grid-area:v;margin:0}}
.tile{padding:11px 16px 12px}

/* ---------- motion ---------- */
.cols.fx > .col,.cols.fx > .rail{animation:colIn .32s var(--ease) both}
.detail.fx > *{animation:rise .34s var(--ease) both}
.detail.fx > :nth-child(2){animation-delay:.02s}
.detail.fx > :nth-child(3){animation-delay:.04s}
.detail.fx > :nth-child(4){animation-delay:.06s}
.detail.fx > :nth-child(n+5){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateX(4px)}to{opacity:1;transform:none}}
@keyframes colIn{from{opacity:0}to{opacity:1}}
@keyframes lift{from{transform:scale(.985);box-shadow:none}to{transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 3px var(--panel),0 0 0 0 var(--accent-line)}100%{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--accent-soft)}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes menu{from{opacity:0;transform:scale(.97) translateY(-3px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:var(--accent-soft)}}
/* ================= Motion & micro-interaction layer (presentation only) ================= */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ambient canvas: drifting glow blobs + pointer parallax (JS sets --px/--py) */
.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.amb i{position:absolute;width:78vmax;height:78vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);will-change:transform;translate:calc(var(--px,0) * var(--d)) calc(var(--py,0) * var(--d))}
.amb i:nth-child(1){--c:var(--glow);--d:-28px;left:-34vmax;top:-46vmax;animation:drift1 34s ease-in-out infinite alternate}
.amb i:nth-child(2){--c:var(--glow-b);--d:22px;right:-38vmax;top:-34vmax;animation:drift2 42s ease-in-out infinite alternate}
.amb i:nth-child(3){--c:var(--glow-c);--d:-16px;left:6vmax;bottom:-52vmax;animation:drift3 50s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(8vmax,6vmax,0) scale(1.08)}}
@keyframes drift2{to{transform:translate3d(-7vmax,9vmax,0) scale(.94)}}
@keyframes drift3{to{transform:translate3d(10vmax,-6vmax,0) scale(1.1)}}
body:has(> .amb){background:var(--bg)}

/* fx overlay (ripples, particles) + tooltip */
.fxl{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.rph{position:absolute;overflow:hidden;pointer-events:none}
.rph i{position:absolute;border-radius:50%;opacity:0}
.pt{position:absolute;width:6px;height:6px;border-radius:2px;pointer-events:none}
.fxtip{position:fixed;left:0;top:0;z-index:61;pointer-events:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--toast);color:var(--toast-ink);box-shadow:var(--sh-hi);opacity:0;transform:translate(-50%,calc(-100% - 4px)) scale(.9);transform-origin:50% 100%;transition:opacity .16s var(--ease),transform .3s var(--spring)}
.fxtip.on{opacity:1;transform:translate(-50%,calc(-100% - 10px)) scale(1)}
.fxtip i{width:7px;height:7px;border-radius:2.5px;background:var(--c)}
.fxtip b{font-weight:700}

/* cursor spotlight: border glow (::before ring) + soft fill (::after), positioned by --mx/--my */
.card,.tile,.w,.hero{isolation:isolate}
.w,.stats{position:relative}
.card::before,.tile::before,.w::before,.hero::before,.stats::before{content:"";display:block;position:absolute;inset:0;box-shadow:none;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--tc,var(--accent)) 90%,transparent),transparent 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .35s var(--ease)}
.lit::before{opacity:1}
.tile:not(.th):not(.res)::after,.w::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--tc,var(--accent)) 10%,transparent),transparent 70%);opacity:0;transition:opacity .35s var(--ease)}
.lit::after{opacity:1}
/* selected card: rotating conic border */
.card.on::before,.card.on.fx::before{opacity:1;padding:1.5px;box-shadow:none;background:conic-gradient(from var(--ang),var(--tc),color-mix(in srgb,var(--tc) 0%,transparent) 22%,var(--g2) 50%,color-mix(in srgb,var(--g2) 0%,transparent) 78%,var(--tc));animation:spin 4.5s linear infinite}
.card.on.lit::before{background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--tc) 90%,transparent),transparent 72%),conic-gradient(from var(--ang),var(--tc),color-mix(in srgb,var(--tc) 0%,transparent) 22%,var(--g2) 50%,color-mix(in srgb,var(--g2) 0%,transparent) 78%,var(--tc))}
@keyframes spin{to{--ang:360deg}}
/* 结果: light sweep on hover */
.tile.res:not(.miss)::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.16) 47%,rgba(255,255,255,.05) 55%,transparent 70%);transform:translateX(-115%)}
.tile.res:not(.miss):hover::after{animation:shimmer 1.15s var(--ease)}
@keyframes shimmer{to{transform:translateX(115%)}}

/* 3D tilt + lift (fine pointers only; JS sets --rx/--ry) */
@media (hover:hover) and (pointer:fine){
  .card,.card:hover,.card:active,.tile:not(.miss),.tile:not(.miss):hover,.tile:not(.miss):active{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate3d(0,var(--ly,0px),0) scale(var(--ps,1))}
  .card,.tile:not(.miss){transition:transform .7s var(--spring),box-shadow .3s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
  .card:hover{--ly:-3px}
  .tile:not(.miss):hover{--ly:-2px}
  .card:active,.tile:not(.miss):active{--ps:.975}
  .card.tilting,.tile.tilting{transition:transform .14s linear,box-shadow .3s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
}

/* press-down + spring release, magnetic pull (JS sets --mgx/--mgy) */
.btn,.chips button,.tog,.seg button,.trow .name,.lab + .sub button,.more,.menu button,.caret,.rail button,.hexp,.col h2 > button,.doc .from button{transform:translate3d(var(--mgx,0px),calc(var(--mgy,0px) + var(--ly,0px)),0) scale(var(--ps,1));transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease),transform .5s var(--spring)}
.btn:active,.chips button:active,.tog:active,.seg button:active,.trow .name:active,.lab + .sub button:active,.more:active,.menu button:active,.caret:active,.rail button:active,.hexp:active,.col h2 > button:active,.doc .from button:active{--ps:.94;transform:translate3d(var(--mgx,0px),calc(var(--mgy,0px) + var(--ly,0px)),0) scale(var(--ps,1));transition-duration:.16s,.16s,.16s,.2s,.2s,.09s}
.chips button:hover{--ly:-1.5px;box-shadow:0 6px 14px -8px rgba(16,24,40,.3)}
.chips button.pop,.trow .name.pop{animation:chipPop .55s var(--spring)}
@keyframes chipPop{0%{scale:.82}55%{scale:1.1}100%{scale:1}}

/* version tabs: gliding indicator pill (JS inserts .vind) */
.vers.ind-on{position:relative;isolation:isolate}
.vers.ind-on button[role=tab]{position:relative;background:transparent;box-shadow:none}
.vers.ind-on button[role=tab]::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--track);z-index:-1;transition:background-color .16s var(--ease)}
.vers.ind-on button[role=tab]:hover{background:transparent}
.vers.ind-on button[role=tab]:hover::before{background:var(--press)}
.vers.ind-on button[role=tab].on::before{background:transparent}
.vind{position:absolute;left:0;top:0;z-index:0;border-radius:999px;pointer-events:none;transform-origin:0 50%;background:linear-gradient(140deg,var(--g1),var(--g2));box-shadow:0 4px 12px -5px var(--g2)}
.vbody.fx.from-r{animation:slideR .4s var(--ease) both}
.vbody.fx.from-l{animation:slideL .4s var(--ease) both}
@keyframes slideR{from{opacity:0;translate:24px 0;filter:blur(2px)}to{opacity:1;translate:0 0;filter:blur(0)}}
@keyframes slideL{from{opacity:0;translate:-24px 0;filter:blur(2px)}to{opacity:1;translate:0 0;filter:blur(0)}}

/* 全部展开对比: versions flip in (收起 reverses in JS) */
.cmp.fx .cell{animation:flipIn .55s var(--ease) both;transform-origin:50% 0}
.cmp.fx .cell:nth-child(2){animation-delay:.07s}
.cmp.fx .cell:nth-child(3){animation-delay:.14s}
.cmp.fx .cell:nth-child(n+4){animation-delay:.2s}
@keyframes flipIn{from{opacity:0;transform:perspective(900px) rotateX(-16deg) translateY(12px) scale(.97)}to{opacity:1;transform:none}}

/* selection: detail tiles stagger in, selected card pops */
.card.on.fx{animation:selPop .5s var(--spring) both}
@keyframes selPop{from{scale:.965}to{scale:1}}
.detail.fx > .bento{animation:none}
.detail.fx .bento > .tile{animation:tileIn .55s var(--ease) both}
.detail.fx .bento > .tile:nth-child(1){animation-delay:.05s}
.detail.fx .bento > .tile:nth-child(2){animation-delay:.1s}
.detail.fx .bento > .tile:nth-child(3){animation-delay:.15s}
.detail.fx .bento > .tile:nth-child(4){animation-delay:.2s}
.detail.fx .kpi{animation:tileIn .45s var(--ease) both}
.detail.fx .kpi:nth-child(2){animation-delay:.06s}
.detail.fx .kpi:nth-child(3){animation-delay:.12s}
@keyframes tileIn{from{opacity:0;translate:0 14px;scale:.96;filter:blur(3px)}to{opacity:1;translate:0 0;scale:1;filter:blur(0)}}
.vt-run .detail.fx > .hero{animation:none}
::view-transition-old(root){animation:none;opacity:0}
::view-transition-new(root){animation:none}
::view-transition-group(fx-title){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}

/* 展开完整文档: cited paragraph highlight sweep */
.detail.fx .doc p.hit,.doc.fx p.hit{animation:none}
.doc p.hit{position:relative;isolation:isolate}
.doc.fx p.hit::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 34%,transparent),color-mix(in srgb,var(--g2) 16%,transparent));transform-origin:0 50%;animation:sweep 1.5s .3s var(--ease) both}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* type bar: hovered segment grows, others dim */
.bar{height:18px;padding:6px 0;margin:-6px 0}
.bar i{transition:opacity .2s var(--ease),scale .35s var(--spring)}
.bar.hov i{opacity:.32}
.bar.hov i.hot{opacity:1;scale:1.05 2}

/* sticky year headers, frosted once stuck (JS toggles .stuck) */
.tl > .yr{position:sticky;top:0;z-index:5;padding:7px 8px;margin:5px -4px -7px;border-radius:12px;transition:background-color .25s var(--ease),box-shadow .25s var(--ease)}
.tl > .yr:first-child{margin-top:-5px}
.tl > .yr.stuck{background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 8px 18px -12px rgba(16,24,40,.35),inset 0 0 0 1px var(--tile-bd)}

/* scroll-driven reveal of timeline cards */
@supports (animation-timeline:view()){
  .tl .card{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
}
@keyframes reveal{from{opacity:0;scale:.94;translate:0 16px}to{opacity:1;scale:1;translate:0 0}}

/* search: focus glow + gentle expand; matches highlighted */
.search{isolation:isolate;transition:scale .45s var(--spring)}
.search::before{content:"";position:absolute;inset:-2px;border-radius:999px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,var(--g1),var(--g2),var(--t2));filter:blur(10px);opacity:0;transition:opacity .35s var(--ease)}
.search:focus-within{scale:1.008}
.search:focus-within::before{opacity:.32}
mark.qhl{color:inherit;background:color-mix(in srgb,var(--accent) 20%,transparent);border-radius:4px;padding:0 1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent);animation:markIn .45s var(--ease)}
@keyframes markIn{from{background:transparent;box-shadow:none}}

/* keyboard focus: ring settles in */
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{animation:ringIn .3s var(--ease)}
@keyframes ringIn{from{outline-offset:7px;outline-color:transparent}}

/* column dividers glow */
.split::before,.split:hover::before,.split.drag::before{display:block;content:"";position:absolute;left:5.5px;top:6%;bottom:6%;width:1px;background:linear-gradient(180deg,transparent,var(--accent),transparent);opacity:0;transition:opacity .25s var(--ease)}
.split:hover::before,.split.drag::before{opacity:.65}
.split:hover::after,.split.drag::after{box-shadow:0 0 0 3px var(--accent-soft),0 0 16px 2px color-mix(in srgb,var(--accent) 45%,transparent)}

/* menus: scale from trigger origin, items cascade */
.menu{animation:menuIn .28s var(--spring) both}
.menu button{animation:menuItem .3s var(--ease) both}
.menu button:nth-child(2){animation-delay:.03s}
.menu button:nth-child(3){animation-delay:.06s}
@keyframes menuIn{from{opacity:0;transform:scale(.86);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes menuItem{from{opacity:0;translate:-6px 0}}

/* toast: spring in, draining progress bar, swipe to dismiss */
.toast{overflow:hidden;touch-action:none;cursor:grab;transform:translate(calc(-50% + var(--dx,0px)),16px) scale(.9);transition:opacity .22s var(--ease),transform .55s var(--spring)}
.toast.show{pointer-events:auto;transform:translate(calc(-50% + var(--dx,0px)),0) scale(1)}
.toast.drag{transition:opacity .22s var(--ease);cursor:grabbing}
.toast::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:linear-gradient(90deg,var(--g1),var(--g2));transform-origin:0 50%;transform:scaleX(0)}
.toast.show::after{animation:tbar 1.6s linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* copy: icon morphs to a drawn check */
.btn.copied{justify-content:center;color:var(--accent);border-color:var(--accent-line)}
.btn .ck path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .45s .05s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* 导出 PDF button: sibling of 复制全文, spinner while the server export runs */
.doc .foot{display:flex;gap:6px;flex-wrap:wrap}
.btn.busy{pointer-events:none;opacity:.8}
.btn .spin{animation:spinR .8s linear infinite}
@keyframes spinR{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.card:hover,.st:hover,.tile:hover{transform:none}}
@media (prefers-reduced-motion:reduce){.amb i{animation:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.search:focus-within{scale:none}}
/* ---------- vault: live data, loading, works, application editing, inline field editing ---------- */
.vbadge,.vsync{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--muted);padding:3px 10px 3px 9px;border-radius:999px;background:var(--track);white-space:nowrap;line-height:18px}
.vbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t4)}

  font-size:12px;color:var(--faint);background:var(--track);border:1px dashed var(--line-2);border-radius:12px}

}

</div>
<div id="qpark" hidden><div class="search qbox" id="qbox"><button type="button" class="qbtn" data-qopen="1" title="搜索（/ 或 ⌘K）" aria-label="搜索"><svg class="ic" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button><input id="q" type="search" placeholder="搜索经历、标签、关键词" aria-label="搜索经历" autocomplete="off"><button type="button" class="qx" data-qclear="1" title="清除搜索" aria-label="清除搜索">×</button></div></div>

<div class="toast" id="toast" role="status"></div>
<script>
const IC=(d,s=14)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

function countStats(s){

<script>
/* ===== Motion engine — presentation only. It wraps render / toast / showMenu and listens with event delegation;
   app state (S, CARDS, DOCS) is only ever read here, never written. ===== */
(()=>{
const RMQ=matchMedia('(prefers-reduced-motion: reduce)'),FINEQ=matchMedia('(hover:hover) and (pointer:fine)');
const rm=()=>RMQ.matches,fine=()=>FINEQ.matches&&!RMQ.matches;
const qs=(s,r=document)=>r.querySelector(s),qsa=(s,r=document)=>[...r.querySelectorAll(s)];

const amb=mk('amb');amb.innerHTML='<i></i><i></i><i></i>';document.body.prepend(amb);
const fxl=mk('fxl');document.body.append(fxl);
const tip=mk('fxtip');document.body.append(tip);
const M={stats:null,res:null,vtPending:false,busy:false,tag:S.tag,type:S.type};

/* ---------- numbers ---------- */
const pn=s=>parseFloat(String(s).replace(/,/g,''))||0;
function fmt(v,sample){const dec=((String(sample).split('.')[1])||'').replace(/\D/g,'').length,n=Number(v.toFixed(dec));
  return /,/.test(sample)?n.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):n.toFixed(dec)}
function countUp(el,from,to,dur){const sample=el.textContent;cancelAnimationFrame(el._cu);const t0=performance.now();el.textContent=fmt(from,sample);

  el._cu=requestAnimationFrame(step)}

/* ---------- render wrapper: snapshot → render → animate the difference ---------- */
const fk=el=>el.classList.contains('yr')?'y'+((el.querySelector('b')||el).textContent):'c'+el.dataset.ck;
function snap(){
  const L=qs('.col.list'),D=qs('.col.detail'),SD=qs('.col.side');
  const on=qs('.tl .card.on[data-ck]');
  const p={selR:on&&on.getBoundingClientRect(),selId:on&&on.dataset.ck,side:!!qs('.cols > .col.side'),cr:{list:qs('.col.list')&&qs('.col.list').getBoundingClientRect(),detail:qs('.col.detail')&&qs('.col.detail').getBoundingClientRect()},key:FX.k,sig:FX.sig,tag:S.tag,type:S.type,rects:new Map(),vers:{},hadList:!!L,sc:{l:L&&L.scrollTop,d:D&&D.scrollTop,s:SD&&SD.scrollTop}};
  if(L&&!rm())qsa('.tl .card[data-ck],.tl > .yr',L).forEach(el=>{if(!el.classList.contains('stuck'))p.rects.set(fk(el),el.getBoundingClientRect())});
  qsa('.vers.ind-on').forEach(v=>{const on=qs('button[role=tab].on',v);if(on)p.vers[on.dataset.ver]={x:on.offsetLeft,y:on.offsetTop,w:on.offsetWidth,vi:+on.dataset.vi}});
  return p;
}
function post(p){

  if(D&&p.sc.d!=null&&FX.k===p.key)D.scrollTop=p.sc.d;
  enhance(p);
  const side=qs('.cols > .col.side');
  if(!!side!==p.side&&p.hadList&&!rm()){   // filter column opened/closed: glide the columns instead of the generic fade

    ['list','detail'].forEach(k=>{const el=qs('.col.'+k),o=p.cr[k];if(!el||!o)return;const dx=o.left-el.getBoundingClientRect().left;
      if(Math.abs(dx)>1)el.animate([{transform:`translateX(${dx}px)`},{transform:'none'}],{duration:440,easing:'cubic-bezier(.2,.8,.2,1)'})});
    if(side)side.animate([{transform:'translateX(-28px)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  if(!rm()){const dir=glide(p);
    if(dir){const D=qs('.col.detail');if(D)D.animate([{transform:`translateY(${dir*14}px)`,filter:'blur(5px)'},{transform:'none',filter:'blur(0px)'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}
    flip(p,L)}

  if(S.tag&&S.tag!==M.tag)qsa('.chips button.on').forEach(b=>b.classList.add('pop'));

  M.tag=S.tag;M.type=S.type;
  if(S.doc&&FX.k!==p.key){const h=qs('.doc p.hit');if(h)requestAnimationFrame(()=>h.scrollIntoView({block:'center',behavior:rm()?'auto':'smooth'}))}
  updateStuck();
}
function enhance(p){
  qsa('.vers[role=tablist]').forEach(v=>{
    const on=qs('button[role=tab].on',v);if(!on)return;
    v.classList.add('ind-on');const ind=mk('vind','span');v.prepend(ind);
    const k=on.dataset.ver,vi=+on.dataset.vi,nx=on.offsetLeft,ny=on.offsetTop,nw=on.offsetWidth,nh=on.offsetHeight;
    ind.style.cssText=`width:${nw}px;height:${nh}px;transform:translate(${nx}px,${ny}px)`;
    const o=p.vers[k];
    if(o&&o.vi!==vi&&!rm()){
      const kf=[{transform:`translate(${o.x}px,${o.y}px) scaleX(${(o.w/nw).toFixed(3)})`},{transform:`translate(${nx}px,${ny}px) scaleX(1)`}];
      ind.animate(kf,{duration:460,easing:'cubic-bezier(.3,1.2,.5,1)'});
      [[45,.35,1.5],[90,.16,3]].forEach(([d,op,b])=>{const g=ind.cloneNode();g.style.opacity=op;g.style.filter=`blur(${b}px)`;g.style.boxShadow='none';ind.after(g);
        g.animate(kf,{duration:460,delay:d,easing:'cubic-bezier(.3,1.2,.5,1)',fill:'backwards'}).finished
          .then(()=>g.animate([{opacity:op},{opacity:0}],{duration:160,fill:'forwards'}).finished).then(()=>g.remove(),()=>g.remove())});
      const b=qs('.vbody',v.closest('.w'));if(b)b.classList.add(vi>o.vi?'from-r':'from-l');
    }

  const q=S.q.trim();if(q)highlight(q);
}
function highlight(q){
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  qsa('.tl .card .t,.tl .card .m,.tl .card .pill,.detail .tile .v,.detail .hero .dt').forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{if(n.parentElement.closest('button.more,mark'))return;const s=n.nodeValue;re.lastIndex=0;if(!re.test(s))return;
      const f=document.createDocumentFragment();let last=0;s.replace(re,(m,i)=>{f.append(s.slice(last,i));const k=document.createElement('mark');k.className='qhl';k.textContent=m;f.append(k);last=i+m.length;return m});
      f.append(s.slice(last));n.replaceWith(f)});
  });
}
/* selection glides from the old card to the new one, with two fading afterimages (拖影) */
function glide(p){
  const on=qs('.tl .card.on[data-ck]'),L=qs('.col.list');
  if(!on||!L||!p.selR||!p.selId||on.dataset.ck===p.selId)return 0;
  const n=on.getBoundingClientRect(),o=p.selR,lr=L.getBoundingClientRect();

  [[0,.9,0],[55,.38,2],[110,.18,4]].forEach(([d,op,b])=>{const g=mk('glide','span');
    g.style.cssText=`left:${n.left}px;top:${n.top}px;width:${n.width}px;height:${n.height}px;--c:${c};opacity:${op};filter:blur(${b}px)`;fxl.append(g);
    g.animate(kf,{duration:460,delay:d,easing:'cubic-bezier(.3,1.1,.4,1)',fill:'backwards'}).finished
      .then(()=>g.animate([{opacity:op},{opacity:0}],{duration:240,easing:'ease-out',fill:'forwards'}).finished).then(()=>g.remove(),()=>g.remove())});

}
function flip(p,L){

    const o=p.rects.get(fk(el)),n=el.getBoundingClientRect();

function numbers(){

    if(!M.stats){if(!rm())sns.forEach((e,i)=>countUp(e,0,vals[i],900+i*140))}
    else sns.forEach((e,i)=>{if(vals[i]!==M.stats[i]&&!rm()){countUp(e,M.stats[i],vals[i],700);e.animate([{scale:1},{scale:1.3},{scale:1}],{duration:560,easing:'cubic-bezier(.3,1.35,.5,1)'})}});
    M.stats=vals}
  const big=qs('.tile.res .big span'),rk=big?FX.k+'|'+big.textContent:null;
  if(big&&rk!==M.res&&!rm())countUp(big,0,pn(big.textContent),850);
  M.res=rk;
}
const _render=render;
function doRender(){const p=snap();_render();post(p)}
render=function(){
  if(M.vtPending)return; // a pending view transition renders the latest state itself
  const nk=S.doc?'d:'+S.doc:'c:'+S.sel;
  const old=FX.k!=null&&nk!==FX.k&&!S.doc&&!rm()&&document.startViewTransition&&document.visibilityState==='visible'?qs(`.tl .card[data-ck="${CSS.escape(String(S.sel))}"] .t`):null;
  if(!old){doRender();return}

};

/* ---------- exit animations before the original handler runs (collapse compare, delete card) ---------- */
let pass=false;
const fold=cells=>{if(!cells.length)return null;let a=null;cells.slice().reverse().forEach((c,i)=>{a=c.animate([{opacity:1,transform:'none'},{opacity:0,transform:'perspective(900px) rotateX(12deg) translateY(-8px) scale(.97)'}],{duration:200,delay:i*45,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'})});return a};
document.addEventListener('click',e=>{
  if(pass)return;
  if(M.busy){e.stopPropagation();e.preventDefault();return}
  if(rm())return;
  const b=e.target.closest&&e.target.closest('button');if(!b)return;const d=b.dataset;let a=null;
  if(d.expall&&S.expAll)a=fold(qsa('.cmp .cell'));
  else if(d.exp&&(S.expAll||S.exp[d.exp]))a=fold(qsa('.cmp .cell',b.closest('.w')));
  else if(d.toggle==='filter'&&S.mode!=='single'&&qs('.cols > .col.side')){const sd=qs('.cols > .col.side');
    a=sd.animate([{transform:'none',opacity:1},{transform:'translateX(-28px)',opacity:0}],{duration:180,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'})}
  else if(d.cm==='del'&&S.menu&&S.menu.confirm){const c=qs(`.tl .card[data-ck="${CSS.escape(String(S.menu.card))}"]`);
    if(c)a=c.animate([{opacity:1,scale:'1',filter:'blur(0px)'},{opacity:0,scale:'.9',filter:'blur(6px)'}],{duration:240,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'})}
  if(!a)return;
  e.stopPropagation();e.preventDefault();M.busy=true;
  a.finished.then(()=>{M.busy=false;pass=true;try{b.click()}finally{pass=false}},()=>{M.busy=false});
},true);

/* ---------- menus scale from their trigger ---------- */
const _showMenu=showMenu;
showMenu=function(){_showMenu();const el=$('menu'),m=S.menu;if(!m||el.hidden)return;
  el.style.transformOrigin=`${Math.round(m.x-parseFloat(el.style.left))}px ${Math.round(m.y-parseFloat(el.style.top))}px`};

/* ---------- toast: replay spring + progress, copy feedback, swipe to dismiss ---------- */
let lastCopy=null;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-copy],[data-copytext]');if(b)lastCopy=b},true);
const _toast=toast;
toast=function(m){const t=$('toast');t.classList.remove('show','drag');t.style.removeProperty('--dx');void t.offsetWidth;_toast(m);

const CK='<svg class="ic ck" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function copied(b){if(!b.isConnected||b.classList.contains('copied'))return;const html=b.innerHTML;
  b.style.width=b.offsetWidth+'px';b.style.height=b.offsetHeight+'px';b.classList.add('copied');b.innerHTML=CK;b.setAttribute('aria-label','已复制');
  if(!rm())burst(b);
  setTimeout(()=>{if(b.isConnected){b.innerHTML=html;b.classList.remove('copied');b.style.width=b.style.height='';b.removeAttribute('aria-label')}},1400)}

function burst(b){const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['--g1','--g2','--t2','--t3','--t4'].map(cssVar);
  for(let i=0;i<12;i++){const p=mk('pt','i'),a=i/12*Math.PI*2+Math.random()*.4,dist=22+Math.random()*18;
    p.style.cssText=`left:${cx-3}px;top:${cy-3}px;background:${cols[i%cols.length]}`;fxl.append(p);
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${(Math.cos(a)*dist).toFixed(1)}px,${(Math.sin(a)*dist).toFixed(1)}px) scale(0) rotate(${(120+Math.random()*120)|0}deg)`,opacity:0}],{duration:620+Math.random()*200,easing:'cubic-bezier(.2,.8,.2,1)'}).finished.then(()=>p.remove(),()=>p.remove())}}
const T=$('toast');let tsx=null;

  else{T.style.removeProperty('--dx');toast.t=setTimeout(()=>T.classList.remove('show'),900)}};
T.addEventListener('pointerup',tEnd);T.addEventListener('pointercancel',tEnd);

/* ---------- ripple (fixed overlay, so it survives the re-render a click triggers) ---------- */

document.addEventListener('pointerdown',e=>{if(e.button!==0||rm())return;const el=e.target.closest&&e.target.closest(RP);if(!el||el.disabled)return;
  const r=el.getBoundingClientRect(),cs=getComputedStyle(el),x=e.clientX,y=e.clientY,h=mk('rph','span'),c=document.createElement('i');

  const d=Math.hypot(Math.max(x-r.left,r.right-x),Math.max(y-r.top,r.bottom-y))*2;

  h.append(c);fxl.append(h);

},{passive:true});

/* ---------- pointer engine: spotlight, tilt, magnet, parallax — one rAF per frame, delegated ---------- */
const SPOT='.card,.tile:not(.miss),.w,.hero,.stats',TILT='.card,.tile:not(.miss)',MAG='.btn.pri,[data-add],.chips button,.tog,.sim .seg button';
const cur={spot:null,tilt:null,mag:null};let rc=new WeakMap(),pe=null,raf=0;

<script>

(()=>{
const qs=s=>document.querySelector(s);
/* image lightbox (C2) — works in both modes */

}
if(!LIVE){window.persist=()=>{};return}

document.body.insertAdjacentHTML('beforeend','<div class="extnote" role="status"><span>这条已在别处更新</span><button class="btn pri" data-extload="1">载入最新</button></div>');
const note=qs('.extnote');
const status=(s,t)=>{VST.s=s;VST.t=t;document.querySelectorAll('.vsync,.vdot').forEach(n=>{n.dataset.s=s;n.title=t;const x=n.querySelector('span');if(x)x.textContent=t})};
const DIR={e:'experiences',a:'applications'},ARR={e:CARDS,a:DOCS};
const base={e:new Map(),a:new Map()},mt={e:new Map(),a:new Map()};   // id → {cmp,raw}; file name → mtime
const inflight=new Set(),again=new Set(),pending=new Map();let busyN=0;
const cmpStr=o=>JSON.stringify(o,function(k,v){return this===o&&k==='updated'?undefined:v});
const remember=(k,o)=>base[k].set(o.id,{cmp:cmpStr(o),raw:JSON.stringify(o)});
const fileUrl=(k,id)=>`/vault/${DIR[k]}/${encodeURIComponent(id)}.json`;
const p2=n=>String(Math.floor(Math.abs(n))).padStart(2,'0');
function isoNow(){const d=new Date(),o=-d.getTimezoneOffset();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}${o>=0?'+':'-'}${p2(o/60)}:${p2(o%60)}`}
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return r.json()}
async function send(method,u,body){
  const r=await fetch(u,{method,headers:{'Content-Type':'application/json','X-Token':TOKEN},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok){let m='';try{m=(await r.json()).error||''}catch(e){}throw new Error(r.status+(m?' '+m:''))}}
function normCard(o,id){
  if(!o||typeof o!=='object'||Array.isArray(o))return null;o.id=id;
  for(const k of ['tags','works','writings'])if(!Array.isArray(o[k]))o[k]=[];
  o.writings=o.writings.filter(w=>w&&typeof w==='object');
  o.writings.forEach(w=>{if(!Array.isArray(w.versions))w.versions=[];w.versions=w.versions.filter(v=>v&&typeof v==='object');w.versions.forEach(v=>{if(v.name==null)v.name='版本';if(v.text==null)v.text=''});if(w.type==null)w.type='写法'});

  if(!o||typeof o!=='object'||Array.isArray(o))return null;o.id=id;
  if(!Array.isArray(o.paras))o.paras=[];

  o.paras.forEach(p=>{if(p.text==null)p.text='';if(p.card===undefined)p.card=null});
  for(const k of ['title','kind','target','scene','date','lang'])if(o[k]==null)o[k]='';
  return o}
const NORM={e:normCard,a:normDoc};

/* ---------- re-render without trampling an input the user is typing in ---------- */
let deferred=false;
const typing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#cols')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
function rerender(){if(typing()){deferred=true;return}deferred=false;render()}
document.addEventListener('focusout',()=>{if(deferred)setTimeout(()=>{if(deferred&&!typing()){deferred=false;render()}},0)});

/* ---------- load ---------- */
async function boot(){
  try{
    const [cfg,el,al]=await Promise.all([getJSON('/vault/config.json').catch(()=>null),getJSON('/vault/experiences/').catch(()=>[]),getJSON('/vault/applications/').catch(()=>[])]);
    if(cfg&&typeof cfg==='object'){VAULT_CFG={schema:cfg.schema||1,...cfg,profile:{name:'',headline:'',location:'',email:'',phone:'',links:[],photo:'',education:[],skills:[],...(cfg.profile||{})}}}
    if(cfg&&Array.isArray(cfg.types)&&cfg.types.length){TYPES.length=0;TYPES.push(...cfg.types.map(String))}
    const load=async(k,list)=>(await Promise.all(list.filter(f=>!f.dir&&/\.json$/.test(f.name)).map(f=>
      getJSON(`/vault/${DIR[k]}/${encodeURIComponent(f.name)}`).then(o=>{mt[k].set(f.name,f.mtime);return NORM[k](o,f.name.slice(0,-5))}).catch(()=>null)))).filter(Boolean);
    const [cs,ds]=await Promise.all([load('e',el),load('a',al)]);
    CARDS.length=0;CARDS.push(...cs);DOCS.length=0;DOCS.push(...ds);
    cs.forEach(o=>remember('e',o));ds.forEach(o=>remember('a',o));
    CARDS.forEach(c=>{if(c.type&&!TYPES.includes(c.type))TYPES.push(c.type)});

}

/* ---------- persist: diff against the last known file content, PUT / DELETE the difference ---------- */
let pt=0;
window.persist=function(delay=150){clearTimeout(pt);pt=setTimeout(flush,delay)};
function busy(n){busyN+=n;if(busyN>0)status('save','保存中…');else if(VST.s==='save')status('ok','已同步')}

  if(S.loading)return;
  for(const k of ['e','a']){const b=base[k],ids=new Set();
    ARR[k].forEach(o=>{ids.add(o.id);const prev=b.get(o.id);if(!prev||prev.cmp!==cmpStr(o))write(k,o,prev)});

async function write(k,o,prev){
  const key=k+o.id,pend=pending.get(key);pending.delete(key);
  if(pend&&pend.o&&prev){   // the AI changed this item while the user was editing: keep the AI's fields, overlay only what the user changed
    const old=JSON.parse(prev.raw),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
    for(const f of Object.keys(pend.o))if(f!=='id'&&same(o[f],old[f]))o[f]=pend.o[f];
    prev={cmp:cmpStr(pend.o),raw:JSON.stringify(pend.o)};
  }
  if(inflight.has(key)){again.add(key);return}
  const now=isoNow();if(!prev){o.schema=o.schema||1;o.created=now}o.updated=now;
  const body=JSON.parse(JSON.stringify(o));remember(k,o);inflight.add(key);busy(1);
  try{await send('PUT',fileUrl(k,o.id),body)}
  catch(e){
    const arr=ARR[k],i=arr.findIndex(x=>x.id===o.id);
    if(prev){if(i>=0)arr[i]=JSON.parse(prev.raw);base[k].set(o.id,prev)}else{if(i>=0)arr.splice(i,1);base[k].delete(o.id)}
    fixSel();status('err','保存失败');toast('保存失败（'+e.message+'），已撤销这次改动');rerender()}
  finally{inflight.delete(key);busy(-1);noteSync();if(again.delete(key))persist(0)}
}
async function remove(k,id,prev){
  const key=k+id;if(inflight.has(key))return;
  base[k].delete(id);pending.delete(key);inflight.add(key);busy(1);
  try{await send('DELETE',fileUrl(k,id));mt[k].delete(id+'.json')}
  catch(e){if(!/^404/.test(e.message)){ARR[k].push(JSON.parse(prev.raw));base[k].set(id,prev);status('err','删除失败');toast('删除失败（'+e.message+'），已恢复');rerender()}}
  finally{inflight.delete(key);busy(-1);noteSync()}
}
function fixSel(){
  if(S.sel&&!card(S.sel)){const v=visible()[0]||CARDS[0];S.sel=v?v.id:null}
  if(S.doc&&!DOCS.some(d=>d.id===S.doc)){S.doc=null;S.docEdit=null}
}

/* ---------- live sync: poll listings, fetch only what changed ---------- */
const editing=(k,id)=>k==='e'?!!((S.fedit&&S.fedit.id===id)||(S.edit&&S.edit.startsWith(id+':'))||(S.rename&&(S.rename==='card#'+id||S.rename.startsWith(id+':')))):S.docEdit===id;
function apply(k,id,o){
  const arr=ARR[k],i=arr.findIndex(x=>x.id===id);
  if(o){if(i>=0)arr[i]=o;else arr.push(o);remember(k,o);if(k==='e'&&o.type&&!TYPES.includes(o.type))TYPES.push(o.type)}

  const key=k+id;if(inflight.has(key))return false;

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-extload]');if(!b)return;
  pending.forEach(p=>{if(p.k==='e'){if(S.fedit&&S.fedit.id===p.id)S.fedit=null;if(S.edit&&S.edit.startsWith(p.id+':'))S.edit=null;if(S.rename&&(S.rename==='card#'+p.id||S.rename.startsWith(p.id+':')))S.rename=null}apply(p.k,p.id,p.o)});

async function poll(){
  if(polling||S.loading)return;polling=true;
  try{let changed=false;
    for(const k of ['e','a']){
      const list=await getJSON(`/vault/${DIR[k]}/`),names=new Set();

/* ---------- works: detect shortcuts whose original moved (listing skips broken links) ---------- */
const alist=new Map();
/* A shortcut counts as broken ONLY when a successful listing of its assets folder lacks it
   (serve.py's listing skips symlinks whose original is gone). When the pipe is unreachable we
   know nothing, so nothing is marked missing — otherwise a stopped server looks like lost files. */
VAULT.missing=function(asset){
  if(VST.s==='off'||VST.s==='err')return false;
  const s=String(asset),i=s.lastIndexOf('/'),dir=i>0?s.slice(0,i):'',name=s.slice(i+1),e=alist.get(dir);
  if(!e||(!e.p&&Date.now()-e.t>15000))listAssets(dir);
  return !!(e&&e.names&&!e.names.has(name));
};
function listAssets(dir,force){
  const e=alist.get(dir)||{t:0,names:null,p:null};alist.set(dir,e);if(e.p)return;if(force)e.t=0;e.t=Date.now();
  e.p=getJSON('/vault/assets/'+dir.split('/').map(encodeURIComponent).join('/')+'/').then(l=>new Set(l.map(f=>f.name)))
    .then(names=>{const was=e.names?[...e.names].sort().join('|'):null;e.names=names;e.p=null;e.t=Date.now();
      if(was!==[...names].sort().join('|'))rerender()},
      ()=>{e.p=null;e.t=0});  // unreachable or error: keep the last known listing, retry later
}

document.addEventListener('error',e=>{const t=e.target;if(t&&(t.tagName==='IMG'||t.tagName==='VIDEO')&&t.dataset&&t.dataset.asset){
