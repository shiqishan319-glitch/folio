      <label class="pfield">专业<input data-ef="major" value="${esc(ed.major||'')}"></label>
      <label class="pfield">学历（如 本科 / 硕士）<input data-ef="degree" value="${esc(ed.degree||'')}"></label>
      <label class="pfield">时间（如 2023.09 – 2027.06）<input data-ef="time" value="${esc(ed.time||'')}"></label>
      <label class="pfield full">成绩 / 主修课程（每行一条，导出简历时会展示）<textarea rows="2" data-ef="details">${esc((ed.details||[]).join('\n'))}</textarea></label>
    </div></div>`).join(''):'<div style="font-size:12.5px;color:var(--muted);padding:8px 2px">还没有填写教育背景，点右上角「+ 添加学历」即可录入。</div>';

  dlg.innerHTML=`<div class="pbox">
    <div class="phead"><h3>个人信息与教育背景</h3><button type="button" class="btn" data-pclose="1">关闭</button></div>
    <div class="pgrid">
      <label class="pfield">姓名<input id="pf-name" value="${esc(p.name||'')}"></label>
      <label class="pfield">头衔 / 求职方向<input id="pf-head" placeholder="如：传播学 · 本科三年级" value="${esc(p.headline||'')}"></label>
      <label class="pfield">邮箱<input id="pf-email" value="${esc(p.email||'')}"></label>
      <label class="pfield">电话<input id="pf-phone" value="${esc(p.phone||'')}"></label>
      <label class="pfield">所在城市 / 到岗时间<input id="pf-loc" placeholder="如：北京 · 可立即到岗" value="${esc(p.location||'')}"></label>
      <label class="pfield">个人主页 / 链接（逗号隔开）<input id="pf-links" value="${esc((p.links||[]).join(', '))}"></label>
      <label class="pfield full">证件照路径（建议让 AI 复制到 ~/经历库/assets/portrait.jpg）<input id="pf-photo" placeholder="assets/portrait.jpg" value="${esc(p.photo||'')}"></label>
    </div>
    <div class="pedu-head"><span>教育背景</span><button type="button" class="btn" data-eduadd="1">+ 添加学历</button></div>
    <div id="pf-edus">${eduHtml()}</div>
    <div class="pedu-head"><span>技能与语言（每行一条，导出简历时显示在底部）</span></div>
    <label class="pfield"><textarea id="pf-skills" rows="3" placeholder="语言：IELTS 7.0（口语 7.0）、CET-6 610&#10;工具：Python、SQL、Figma">${esc((p.skills||[]).join('\n'))}</textarea></label>
    <div class="pfoot"><button type="button" class="btn" data-pclose="1">取消</button><button type="button" class="btn pri" id="pf-save">保存</button></div>
  </div>`;
  document.body.append(dlg);
  requestAnimationFrame(()=>dlg.classList.add('on'));

  const syncEdus=()=>{
    dlg.querySelectorAll('.pedu-item').forEach(el=>{
      const i=+el.dataset.ei;
      edus[i]={
        school:el.querySelector('[data-ef="school"]').value.trim(),
        major:el.querySelector('[data-ef="major"]').value.trim(),
        degree:el.querySelector('[data-ef="degree"]').value.trim(),
        time:el.querySelector('[data-ef="time"]').value.trim(),
        details:el.querySelector('[data-ef="details"]').value.split('\n').map(s=>s.trim()).filter(Boolean)
      };
    });
  };
  const close=()=>{dlg.classList.remove('on');setTimeout(()=>dlg.remove(),200)};
  dlg.addEventListener('click',e=>{
    if(e.target===dlg||e.target.closest('[data-pclose]')){close();return}
    if(e.target.closest('[data-eduadd]')){syncEdus();edus.push({school:'',major:'',degree:'',time:'',details:[]});document.getElementById('pf-edus').innerHTML=eduHtml();return}
    const del=e.target.closest('[data-edudel]');
    if(del){syncEdus();edus.splice(+del.dataset.edudel,1);document.getElementById('pf-edus').innerHTML=eduHtml();return}
    if(e.target.id==='pf-save'){
      syncEdus();
      const prof={
        name:document.getElementById('pf-name').value.trim(),
        headline:document.getElementById('pf-head').value.trim(),
        location:document.getElementById('pf-loc').value.trim(),
        email:document.getElementById('pf-email').value.trim(),
        phone:document.getElementById('pf-phone').value.trim(),
        links:document.getElementById('pf-links').value.split(',').map(s=>s.trim()).filter(Boolean),
        photo:document.getElementById('pf-photo').value.trim(),
        education:edus.filter(x=>x.school||x.major||x.degree||x.time||(x.details&&x.details.length)),
        skills:document.getElementById('pf-skills').value.split('\n').map(s=>s.trim()).filter(Boolean)
      };
      close();
      if(window.saveProfileConfig)window.saveProfileConfig(prof);
    }
  });
}
</script>
</body>
</html>
