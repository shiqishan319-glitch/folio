<head>

<!-- 经历库 · 个人主页模板。由 scripts/fill_html.py site 生成；单文件、无外部依赖，双击即可打开，也可以直接放到 GitHub Pages。 -->
<style>
  :root {
    --bg: #f4f5f9; --panel: #ffffff; --ink: #14161d; --ink-2: #3b4150; --muted: #6b7282; --line: #e3e6ee;
    --accent: #4a5cff; --accent-2: #9b5cff; --soft: #eef0ff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0e14; --panel: #161922; --ink: #eef0f6; --ink-2: #c7ccd8; --muted: #9aa1b2; --line: #2a2e3b; --accent: #8f9bff; --accent-2: #c08cff; --soft: rgba(143,155,255,.14); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-image: radial-gradient(900px 500px at 10% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
                      radial-gradient(700px 480px at 100% 0%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 60%);
    background-attachment: fixed;
  }
  main { max-width: 880px; margin: 0 auto; padding: 56px 20px 64px; }
  .hero { display: flex; gap: 28px; align-items: center; margin-bottom: 36px; }
  .hero img { width: 112px; height: 140px; object-fit: cover; border-radius: 18px; box-shadow: 0 18px 40px -20px rgba(0,0,0,.45); flex: none; }
  .hero h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.15; letter-spacing: .02em; }
  .hero .headline { margin: 10px 0 0; font-size: 17px; color: var(--ink-2); }
  .contact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 0; list-style: none; }
  .contact li { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); }
  .contact a { color: inherit; text-decoration: none; }
  .contact a:hover { color: var(--accent); }
  section { margin-top: 30px; }
  section > h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  section > h2::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .entry { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 28px -18px rgba(16,24,40,.2); }
  .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .entry-head h3 { margin: 0; font-size: 17px; }
  .time { font-size: 12.5px; color: var(--accent); background: var(--soft); padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lines { margin: 8px 0 0; padding: 0; list-style: none; }
  .lines li { position: relative; padding-left: 16px; margin: 4px 0; color: var(--ink-2); }
  .lines li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .7; }
  .lines li.plain, .lines li.summary { padding-left: 0; }
  .lines li.plain::before, .lines li.summary::before { display: none; }
  .lines li.summary { color: var(--ink); }
  .lines b { color: var(--ink); font-weight: 600; }
  footer { margin-top: 44px; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    main { padding-top: 32px; }
    .hero { flex-direction: column-reverse; align-items: flex-start; gap: 18px; }
    .hero img { width: 88px; height: 110px; }
    .entry { padding: 16px; }
  }
  @media print {
    body { background: #fff; }
    .entry { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>

</body>
